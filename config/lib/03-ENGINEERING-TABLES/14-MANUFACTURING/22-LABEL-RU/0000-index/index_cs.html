	<title></title>
	<style>         
		body { font-family:Verdana; }        
		#hlavicka { display:inline-block;  width:100%; }
		#logo { float:right; height:40px; }
	 	#nadpis { font: bold 30px Verdana; padding:5px; }
		.cleaner{ clear: both; }
   </style>     
		<script>
		document.addEventListener('DOMContentLoaded', function() {
			
			function $(id) {return document.getElementById(id);	}
			
			$('nadpis').innerHTML = 'ahoj'
			
			function load (file, funct, par) { // standartní funkce na http request na pozadí
				var xhr = new XMLHttpRequest();
				xhr.overrideMimeType("text/plain");
				xhr.onreadystatechange = function() { if (xhr.readyState == 4){ funct(xhr.responseText, par, xhr.status ) } }
				xhr.open("GET", file); xhr.send();
			}

			function parse(text) { // dostane od funkce nahoře text toho souboru
				text.split('\n').forEach(function(line,i){ // jede cyklus pro každou řádku
					if (res = line.match(/^Label\\cs=(.*)/)) {
						$('nadpis').innerHTML = res[1]
						document.title = res[1]
					}
				});
			}

			function find_img(i, name) { 
				const suffix = ['jpg', 'jpeg', 'png', 'gif'];
				for (var j in suffix){
					load_img (i, name+'.'+suffix[j]);
				}
				
			}
			
			var images = document.getElementsByTagName('img') // jede cyklus pro každý obrázek
			for(var i=0; i<images.length; i++){ 
				if (images[i].dataset['name'] !== undefined) find_img(i, images[i].dataset['name'])
			}
			
			function load_img (i,name) { load(name, paste_img, {i,name}) }
			
			function paste_img(text, par, status) {
				if (text.length == 0) return
				if (text.search("</html>") > 0) return
				images[par['i']].src = par['name'] 
			}

			load('metadata.ini', parse)

		}, false);
		</script>

  </head>
  <body>

		<div id='hlavicka'>
			<a href='http://zima-engineering.cz'><img id='logo' src="ZIMA-Engineering.png"></a>  
			<div id='nadpis'></div>
    </div><br class="cleaner"> 
    <img data-name="01"> <br>
    
  </body>
