[Font]
; Path is relative to the config directory. The bundled font is required so
; drawing text has identical metrics on every workstation.
File = fonts/osifont-lgpl3fe.ttf
Family = osifont
FallbackFamily = sans-serif

; Text heights are real paper millimetres, independent of view scale and zoom.
SmallHeight = 1.8
NormalHeight = 2.5
LargeHeight = 3.5

[Workspace]
PaperBoundaryColor = #808080

[Pens]
YellowColor = #E6C85C
YellowWidth = 0.25
GreenColor = #4DD811
GreenWidth = 0.25
WhiteColor = #FFFFFF
WhiteWidth = 0.50
