Assembly Sketch container has no Sketch. = Le conteneur d’esquisse d’assemblage ne contient aucune esquisse.

History operations require an open Assembly. = Les opérations d’historique nécessitent un assemblage ouvert.

The destination must belong to the same Assembly history list. = La destination doit appartenir à la même liste d’historique de l’assemblage.

Read Part history or the separate Assembly history lists without calculation. = Lire l’historique de pièce ou les listes distinctes d’historique d’assemblage sans calcul.

Named views require a name, a rotation quaternion, zoom, pan and reference scale. = Les vues nommées nécessitent un nom, un quaternion de rotation, un zoom, un décalage et une échelle de référence.

A view name must contain 1 to 1024 bytes without control characters. = Le nom de vue doit contenir de 1 à 1024 octets sans caractères de contrôle.

View camera values must be finite and both scales must be positive. = Les valeurs de caméra doivent être finies et les deux échelles positives.

A view rotation quaternion must be nonzero. = Le quaternion de rotation d’une vue ne doit pas être nul.

Named view names must be unique. = Les noms des vues nommées doivent être uniques.

Named views can only be edited in the active document. = Les vues nommées ne peuvent être modifiées que dans le document actif.

Named views require an open Part or Assembly. = Les vues nommées nécessitent une pièce ou un assemblage ouvert.

Named view not found. = Vue nommée introuvable.

Pass the view name separately from its camera. = Indiquez le nom de vue séparément de sa caméra.

List saved camera views without changing the displayed camera. = Lister les vues enregistrées sans modifier la caméra affichée.

Read a named camera view including its rotation, zoom and pan. = Lire une vue nommée avec sa rotation, son zoom et son décalage.

Save or replace a complete named camera view without calculating geometry. = Enregistrer ou remplacer une vue nommée complète sans calculer la géométrie.

Delete a saved camera view without changing geometry. = Supprimer une vue enregistrée sans modifier la géométrie.

