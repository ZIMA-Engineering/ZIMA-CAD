Specify a file or directory path. = Indiquez un chemin de fichier ou de dossier.
Archive operations require a native document or template path. = Les opérations sur les archives nécessitent le chemin d’un document natif ou d’un modèle.
The archive directory does not exist. = Le dossier des archives n’existe pas.
Only distinct numbered native archive files may be removed. = Seules des archives natives numérotées distinctes peuvent être supprimées.
The archive files changed; list them again before deleting. = Les archives ont changé ; actualisez leur liste avant de les supprimer.
The archive file no longer exists. = Le fichier d’archive n’existe plus.
The number of archives to keep must be a nonnegative integer. = Le nombre d’archives à conserver doit être un entier positif ou nul.
Remove older native archives and keep the requested newest count per document. = Supprimer les anciennes archives natives en conservant le nombre demandé de versions récentes par document.
List numbered native archives in numerical order without opening documents. = Lister les archives natives numérotées dans l’ordre numérique sans ouvrir les documents.
Archives removed before the failure: = Archives supprimées avant l’erreur :

The document is not open. = Le document n’est pas ouvert.
The document has no saved native file. = Le document n’a pas de fichier natif enregistré.
The current native file is missing or is not a regular file. = Le fichier natif actuel est absent ou n’est pas un fichier ordinaire.
The document has unsaved changes. Save it or explicitly allow discard. = Le document contient des modifications non enregistrées. Enregistrez-le ou autorisez explicitement leur abandon.
The document changed before file deletion. = Le document a changé avant la suppression du fichier.
The native file changed before deletion. = Le fichier natif a changé avant sa suppression.
The deleted document could not be closed. = Le document du fichier supprimé n’a pas pu être fermé.
Delete the saved file of an open document; optionally include archives. = Supprimer le fichier enregistré d’un document ouvert, avec ses archives en option.
Files removed before the failure: = Fichiers supprimés avant l’erreur :
Unsaved changes in this document will also be discarded. = Les modifications non enregistrées de ce document seront également abandonnées.
Odstranit soubor %1 včetně archivů (%2)? = Supprimer le fichier %1 avec ses archives (%2) ?

File relocation requires document identity and normalized absolute paths. = Le changement de chemin exige l’identité du document et des chemins absolus normalisés.
File relocation contains duplicate document identities or paths. = Le changement de chemin contient des identités de document ou des chemins en double.
A relative native reference requires its owning document path. = Une référence native relative exige le chemin du document qui la contient.
Native reference path and document identity disagree. = Le chemin de la référence native ne correspond pas à l’identité du document.
Document type does not match target path = Le type de document ne correspond pas au chemin cible
A native rename input is missing or is not a regular file. = Un fichier à traiter pour le renommage est absent ou n’est pas un fichier ordinaire.
Cannot create a private native rename staging directory. = Impossible de créer le répertoire temporaire pour renommer les fichiers natifs.
The native rename destination already exists. = Le fichier cible du renommage existe déjà.
Another open document already uses the native rename destination. = Un autre document ouvert utilise déjà le chemin cible du renommage.
Enter a filename without directories or forbidden characters. = Saisissez un nom de fichier sans répertoire ni caractère interdit.
Renaming a native file must preserve its document extension. = Le renommage doit conserver l’extension native du document.
Native rename staging can run only once. = La préparation du renommage ne peut être exécutée qu’une fois.
A native rename input changed during staging. = Un fichier à traiter a changé pendant la préparation du renommage.
The saved native file has a different document identity. = Le fichier natif enregistré a une identité de document différente.
Different native files have the renamed document identity. = Plusieurs fichiers natifs ont l’identité du document à renommer.
Staged native document identity does not match its source. = L’identité du document natif préparé ne correspond pas à sa source.
The set of native dependency files changed during staging. = La liste des fichiers de dépendance natifs a changé pendant la préparation.
Native rename has not been staged or has already finished. = Le renommage n’a pas été préparé ou est déjà terminé.
Open documents changed before native file rename. = Des documents ouverts ont changé avant le renommage.
A native rename input changed before publication. = Un fichier à traiter a changé avant la finalisation du renommage.
The set of native dependency files changed before publication. = La liste des fichiers de dépendance natifs a changé avant la finalisation du renommage.
Rename an open native document and update its file references. = Renommer un document natif ouvert et actualiser ses références de fichiers.
