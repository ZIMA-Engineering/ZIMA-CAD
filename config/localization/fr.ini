Uložený dokument byl mezitím zavřen nebo změnil cestu. = Le document a été fermé ou son chemin a changé pendant l’enregistrement.

Box = Pavé droit
Read Box dimensions without calculating geometry. = Lire les dimensions du pavé sans calculer la géométrie.
Create a Box in the active Body: length, width, height in mm. = Créer un pavé dans le corps actif : longueur, largeur, hauteur en mm.
Change the specified Box dimensions in mm. = Modifier les dimensions indiquées du pavé en mm.
Specify at least one Box dimension. = Indiquez au moins une dimension du pavé.
Use a decimal number in mm with a decimal point. = Saisissez un nombre en mm avec un point décimal.
Box dimensions must be between 0.001 and 1000000 mm. = Les dimensions du pavé doivent être comprises entre 0,001 et 1000000 mm.
Unlock the dimension before changing it. = Déverrouillez la dimension avant de la modifier.
Box operations require an open Part. = Les opérations sur un pavé nécessitent une pièce ouverte.
The selected container is not a Box. = Le conteneur sélectionné n’est pas un pavé.
The requested container does not exist. = Le conteneur demandé n’existe pas.
Editing must preserve the container identity. = La modification doit préserver l’identité du conteneur.
A new container must have a new nonempty identity. = Un nouveau conteneur doit avoir une nouvelle identité non vide.
A derived Body cannot be edited directly. = Un corps dérivé ne peut pas être modifié directement.

Cylinder = Cylindre
Sphere = Sphère
Cone = Cône
Pyramid = Pyramide
Wedge = Coin
Read primitive dimensions without calculating geometry. = Lire les dimensions de la primitive sans calculer la géométrie.
Create a primitive in the active Body; dimensions are in mm. = Créer une primitive dans le corps actif ; dimensions en mm.
Change the specified primitive dimensions in mm. = Modifier les dimensions indiquées de la primitive en mm.
Primitive dimensions must be between 0.001 and 1000000 mm; top radius and top offset may be zero. = Les dimensions doivent être comprises entre 0,001 et 1000000 mm ; le rayon supérieur et le décalage supérieur peuvent être nuls.
This container is not a supported primitive. = Ce conteneur n’est pas une primitive prise en charge.
Primitive operations require an open Part. = Les opérations sur les primitives nécessitent une pièce ouverte.
The requested primitive type does not match the container. = Le type de primitive demandé ne correspond pas au conteneur.
Specify at least one primitive dimension. = Indiquez au moins une dimension de la primitive.
Unknown primitive dimension. = Dimension de primitive inconnue.
Wedge top offset cannot exceed its length. = Le décalage supérieur du coin ne peut pas dépasser sa longueur.

Zobrazit pracovní adresář. = Afficher le dossier de travail.

Změnit pracovní adresář: cd cesta. = Changer le dossier de travail : cd chemin.

Pracovní adresář neexistuje. = Le dossier de travail n’existe pas.

Zobrazit otevřený dokument podle jeho ID. = Afficher un document ouvert à partir de son identifiant.

Dokument není otevřený. = Le document n’est pas ouvert.

Zavřít dokument; volba discard výslovně zahodí neuložené změny. = Fermer le document ; discard abandonne explicitement les modifications non enregistrées.

Dokument má neuložené změny. Uložte jej nebo povolte zahození volbou discard. = Le document contient des modifications non enregistrées. Enregistrez-le ou autorisez leur abandon avec discard.

Uložit nezávislou kopii včetně navázaných výkresů: save_as cesta. = Enregistrer une copie indépendante avec les dessins associés : save_as chemin.

Tento příkaz není dostupný při úpravě šablony. = Cette commande n’est pas disponible pendant la modification d’un modèle.

Kopie uložena: %1 = Copie enregistrée : %1

Kopie musí mít příponu odpovídající typu dokumentu. = L’extension de la copie doit correspondre au type de document.

Body operations require an open Part. = Les opérations sur les corps nécessitent une pièce ouverte.

Body history changed while properties were open. = L’historique des corps a changé pendant l’ouverture des propriétés.

The requested Body does not exist. = Le corps demandé n’existe pas.

The requested Body Boolean does not exist. = L’opération booléenne demandée n’existe pas.

Body properties cannot replace identity, contents or dependencies. = Les propriétés du corps ne peuvent pas remplacer son identité, son contenu ou ses dépendances.

Boolean properties cannot replace its identity. = Les propriétés booléennes ne peuvent pas remplacer l’identité.

Activate the Body before changing its history cursor. = Activez le corps avant de modifier son curseur d’historique.

Specify a nonempty object name. = Saisissez un nom d’objet non vide.

Expected add, subtract or intersect. = Valeur attendue : add, subtract ou intersect.

Read Bodies, Boolean results and their history order. = Lire les corps, les résultats booléens et leur ordre dans l’historique.

Read Body properties and persisted placement references. = Lire les propriétés du corps et ses références de positionnement enregistrées.

Create a Body attached to the Part origin. = Créer un corps lié à l’origine de la pièce.

Change Body name, visibility or activation. = Modifier le nom, la visibilité ou l’activation du corps.

Specify at least one Body property. = Indiquez au moins une propriété du corps.

Activate a Body; omit its ID to deactivate it. = Activer un corps ; omettre son identifiant pour le désactiver.

Set the insertion index in Body history or in the active Body. = Définir l’indice d’insertion dans l’historique des corps ou dans le corps actif.

The history index must be a nonnegative integer. = L’indice d’historique doit être un entier positif ou nul.

Read a Body Boolean and its two source results. = Lire une opération booléenne et ses deux résultats sources.

Calculate a Boolean from two available Body results. = Calculer une opération booléenne sur deux résultats de corps disponibles.

Edit a Body Boolean using the same operation as Properties. = Modifier l’opération booléenne comme dans les propriétés.

Specify at least one Boolean property. = Indiquez au moins une propriété booléenne.

; Shared Part history commands
History operations require an open Part. = Les opérations d’historique nécessitent une pièce ouverte.
History changed; some dependent features could not be calculated. = Historique modifié ; certains éléments dépendants n’ont pas pu être calculés.
Read Part history, ownership, suppression and calculation errors. = Lire l’historique, l’appartenance, la suppression temporaire et les erreurs de calcul.
Set suppression of a history object and calculate the Part. = Définir la suppression temporaire d’un objet d’historique et calculer la pièce.
Delete a history object, Body or Boolean and calculate the Part. = Supprimer un objet d’historique, un corps ou un booléen et calculer la pièce.
Move an object before another in the same history; omit before for the end. = Déplacer un objet avant un autre dans le même historique ; omettre before pour la fin.
Check history order and dependencies without calculating geometry. = Vérifier l’ordre et les dépendances sans calculer la géométrie.
Set the insertion index in the flattened Part history. = Définir l’indice d’insertion dans l’historique global de la pièce.
Activate the owning Body before editing its history. = Activer le corps propriétaire avant de modifier son historique.
The requested history object does not exist or is owned by a feature. = L’objet d’historique n’existe pas ou appartient à une fonction.
The object and destination must belong to the same history scope. = L’objet et la destination doivent appartenir au même historique.
The move would break a history dependency. = Le déplacement romprait une dépendance de l’historique.
The history index is outside the document history. = L’indice est en dehors de l’historique du document.
The first feature of a Body cannot be subtractive. = La première fonction d’un corps ne peut pas être soustractive.
The move would remove a persisted reference. = Le déplacement supprimerait une référence enregistrée.
The move would remove original reference geometry. = Le déplacement supprimerait la géométrie de référence d’origine.
The move would break a construction reference. = Le déplacement romprait une référence de construction.
The move would break a container reference. = Le déplacement romprait une référence de conteneur.
The move would break an external Sketch reference. = Le déplacement romprait une référence externe d’esquisse.

; Original reference queries
Reference queries require an open Part or Assembly. = Les requêtes de références nécessitent une pièce ou un assemblage ouvert.
Reference pagination is outside the supported range. = La pagination des références dépasse les limites autorisées.
Reference kind must be face, edge, point or axis. = Le type de référence doit être face, edge, point ou axis.
The persisted reference geometry is incomplete. = La géométrie de référence enregistrée est incomplète.
List persisted original faces, edges, points and axes without calculation. = Lister les faces, arêtes, points et axes d’origine enregistrés sans calcul.
Read one original reference and its bounded persisted geometry in document coordinates. = Lire une référence d’origine et ses données géométriques limitées dans les coordonnées du document.
The exact original reference was not found in the stored document state. = La référence d’origine exacte est introuvable dans l’état enregistré du document.

; Shared Sketch geometry commands
A B-spline requires 2 to 4096 points. = Une B-spline nécessite de 2 à 4096 points.
A Sketch name must contain 1 to 1024 UTF-8 bytes. = Le nom de l’esquisse doit contenir de 1 à 1024 octets UTF-8.
A new Part Sketch must have its own Sketch container. = Une nouvelle esquisse de pièce doit avoir son propre conteneur.
A point must be [x, y] in Sketch millimetres. = Un point doit être [x, y] en millimètres d’esquisse.
A standalone Assembly Sketch cannot own a cut container. = Une esquisse indépendante d’assemblage ne peut pas posséder un conteneur de coupe.
Add a constrained native rectangle from opposite corners. = Ajouter un rectangle contraint par ses coins opposés.
Add a native B-spline from control or interpolation points. = Ajouter une B-spline à partir de points de contrôle ou d’interpolation.
Add a native point in Sketch coordinates (mm). = Ajouter un point en coordonnées d’esquisse (mm).
Add a native segment between two Sketch points (mm). = Ajouter un segment entre deux points d’esquisse (mm).
Add a regular polygon using a center and rim point. = Ajouter un polygone régulier par son centre et un point du contour.
Add an exact circle with radius in millimetres. = Ajouter un cercle exact avec un rayon en millimètres.
Add an exact circular arc through start and end points. = Ajouter un arc de cercle exact par ses points de début et de fin.
Add exact elliptical geometry from its center and axis endpoints. = Ajouter une géométrie elliptique exacte par son centre et les extrémités des axes.
An ID list must contain at most 4096 strings. = Une liste d’identifiants peut contenir au plus 4096 chaînes.
An ID list must contain nonempty strings. = Une liste d’identifiants doit contenir des chaînes non vides.
Coordinates must be finite numbers in millimetres. = Les coordonnées doivent être des nombres finis en millimètres.
Create a standalone Sketch using the standard container factory. = Créer une esquisse indépendante avec le conteneur standard.
Delete native Sketch geometry using the Sketcher's dependency rules. = Supprimer la géométrie selon les règles de dépendance de l’esquisse.
Each B-spline point must be [x, y]. = Chaque point de B-spline doit être [x, y].
Edit this Sketch through its owning section operation. = Modifier cette esquisse via son opération de coupe.
Integer argument is outside its allowed range. = L’argument entier est hors de la plage autorisée.
List persisted Sketches without calculating geometry. = Lister les esquisses enregistrées sans calculer la géométrie.
List stable Sketch entity IDs and kinds. = Lister les identifiants stables et les types d’entités d’esquisse.
Move a native point subject to its constraints. = Déplacer un point en respectant ses contraintes.
Read Sketch metadata and geometry counts. = Lire les métadonnées et les nombres d’éléments de l’esquisse.
Read one persisted Sketch entity; lengths use millimetres. = Lire une entité d’esquisse enregistrée ; longueurs en millimètres.
Remove a native point and its dependent Sketch geometry. = Supprimer un point et sa géométrie d’esquisse dépendante.
Set a native point's fixed state. = Définir l’état fixe d’un point.
Set a native segment's unbounded centerline state. = Activer ou désactiver le segment comme axe illimité.
Set the auxiliary state of native Sketch geometry. = Définir l’état auxiliaire de la géométrie d’esquisse.
Sketch commands require an ordinary Part or Assembly. = Les commandes d’esquisse nécessitent une pièce ou un assemblage ordinaire.
Sketch creation requires the active document. = La création d’esquisse nécessite le document actif.
Sketch operations require an open Part or Assembly. = Les opérations d’esquisse nécessitent une pièce ou un assemblage ouvert.
Sketch plane must be XY, XZ or YZ. = Le plan d’esquisse doit être XY, XZ ou YZ.
Snap tolerance must be positive millimetres. = La tolérance d’accrochage doit être positive, en millimètres.
The Sketch entity does not exist. = L’entité d’esquisse n’existe pas.
The Sketch identity already exists. = L’identité d’esquisse existe déjà.
The entity exceeds the 64 KiB query limit. = L’entité dépasse la limite de requête de 64 Kio.
The native Sketch geometry does not exist. = La géométrie d’esquisse n’existe pas.
The native Sketch point does not exist. = Le point d’esquisse n’existe pas.
The point cannot move to the requested position. = Le point ne peut pas être déplacé à la position demandée.
The requested Sketch does not exist. = L’esquisse demandée n’existe pas.
The selection cannot translate by the requested displacement. = La sélection ne peut pas être déplacée du décalage demandé.
Translate native Sketch points and geometry subject to constraints. = Translater les points et la géométrie d’esquisse selon les contraintes.
Translation requires at least one native point or geometry ID. = Une translation nécessite au moins un identifiant de point ou de géométrie.

; Sketch offset and curve operations
The native Sketch offset does not exist. = Le décalage d’esquisse n’existe pas.
Retain requires 1 to 1024 nonoverlapping intervals. = La conservation nécessite de 1 à 1024 intervalles sans chevauchement.
Each retained interval must be [start, end] inside [0, 1]. = Chaque intervalle conservé doit être [start, end] dans [0, 1].
Retained intervals must not overlap. = Les intervalles conservés ne doivent pas se chevaucher.
Offset a native Sketch curve; distance is positive millimetres. = Décaler une courbe d’esquisse d’une distance positive en millimètres.
Edit all retained pieces of one Sketch offset operation. = Modifier toutes les parties conservées d’un même décalage d’esquisse.
Read an offset's source, retained interval and repair state. = Lire la source, l’intervalle conservé et l’état de réparation d’un décalage.
Detach an offset while preserving its current curve and identity. = Détacher un décalage en conservant sa courbe et son identité.
Read a curve's complete supporting spline and visible interval. = Lire la spline support complète et l’intervalle visible d’une courbe.
Retain explicit curve intervals while preserving the original supporting geometry. = Conserver les intervalles indiqués et la géométrie support d’origine.
List current intersection-bounded curve pieces for explicit trimming. = Lister les portions actuelles entre intersections pour le rognage.
Remove explicitly identified current trim pieces; stale intervals are rejected. = Supprimer les portions actuelles désignées ; les intervalles périmés sont refusés.
Trim requires 1 to 2048 piece identities. = Le rognage nécessite de 1 à 2048 identités de portions.
Each trim identity requires exactly geometry, start and end. = Chaque identité de rognage nécessite exactement geometry, start et end.
A trim piece cannot be selected twice. = Une portion ne peut pas être sélectionnée deux fois pour le rognage.
The requested trim piece no longer exists; read the current pieces. = La portion demandée n’existe plus ; relire les portions actuelles.
Mirror native Sketch entities about an explicitly identified Sketch axis. = Refléter les entités d’esquisse autour d’un axe désigné.
Mirror requires native Sketch entities. = La symétrie nécessite des entités natives d’esquisse.
Create an oriented rectangle using a Sketch symmetry axis. = Créer un rectangle orienté avec un axe de symétrie d’esquisse.
Create a circular arc tangent to an explicitly identified curve. = Créer un arc de cercle tangent à la courbe désignée.
Create a common tangent segment using two curves and contact hints. = Créer une tangente commune à deux courbes avec des indications de contact.
Round a Sketch corner without destroying its source segments. = Arrondir un coin d’esquisse en conservant ses segments sources.

; Sketch constraints and solver
Create a native Sketch relation using explicitly ordered points and geometry. = Créer une contrainte d’esquisse avec des points et géométries explicitement ordonnés.
The constraint requires a different number of points or geometry references. = La contrainte nécessite un autre nombre de points ou de références géométriques.
Tangency requires two curves and at most one contact point. = La tangence nécessite deux courbes et au plus un point de contact.
Unknown Sketch constraint kind. = Type de contrainte d’esquisse inconnu.
Remove a Sketch relation and solve its remaining constraints. = Supprimer une contrainte d’esquisse et résoudre les contraintes restantes.
Explicitly solve a Sketch without calculating a solid body. = Résoudre explicitement une esquisse sans calculer de solide.
The Sketch constraints could not be solved; no change was committed. = Les contraintes d’esquisse n’ont pas pu être résolues ; aucune modification validée.
Inspect constraint residual and free degrees of freedom on a temporary Sketch copy. = Examiner le résidu et les degrés de liberté sur une copie temporaire de l’esquisse.

; Sketch dimension commands
A symmetric line dimension requires an axis and one or two lines. = Une cote symétrique de lignes nécessite un axe et une ou deux lignes.
A symmetric point dimension requires one or two points and an axis. = Une cote symétrique de points nécessite un ou deux points et un axe.
Create or edit Sketch dimension properties; lengths use mm and angles degrees. = Créer ou modifier une cote d’esquisse ; longueurs en mm et angles en degrés.
Dimension angle sector must be -1, 0 or 1. = Le secteur angulaire de la cote doit être -1, 0 ou 1.
Dimension label layout must belong to the edited Sketch. = La disposition du libellé doit appartenir à l’esquisse modifiée.
Dimension layout flags must be booleans. = Les options de disposition doivent être des booléens.
Dimension limits accept only lower and upper. = Les limites de cote acceptent uniquement lower et upper.
Dimension solution side must be -1 or 1. = Le côté de résolution de la cote doit être -1 ou 1.
Dimension text accepts known string fields of at most 2048 bytes. = Le texte de cote accepte les champs connus de 2048 octets maximum.
Read a Sketch dimension's parameters, references and label layout. = Lire les paramètres, références et disposition d’une cote d’esquisse.
Remove a Sketch dimension using the native solver transaction. = Supprimer une cote d’esquisse avec la transaction native du solveur.
The Sketch dimension does not exist. = La cote d’esquisse n’existe pas.
The dimension requires a different number of points or geometry references. = La cote nécessite un autre nombre de points ou de références géométriques.
The selected axis does not match the requested coordinate dimension. = L’axe choisi ne correspond pas à la cote de coordonnée demandée.
Unknown Sketch dimension kind. = Type de cote d’esquisse inconnu.
Unknown dimension label layout field. = Champ de disposition du libellé de cote inconnu.
Unknown dimension tolerance mode. = Mode de tolérance de cote inconnu.
Angular dimension plane is defined by its measured rays = Le plan de la cote angulaire est défini par ses rayons mesurés

; Sketch external reference commands
Create native profile geometry linked to an existing projected edge. = Créer une géométrie de profil liée à une arête projetée.
Detach an external reference while preserving its native profile curves. = Détacher une référence externe en conservant ses courbes de profil.
Edit an in-context reference in its owning Assembly context. = Modifier la référence contextuelle dans son assemblage propriétaire.
Explicitly refresh a Sketch's references from its document's calculated snapshot. = Actualiser explicitement les références depuis l’état calculé du document.
Persisted source axis geometry is unavailable = La géométrie enregistrée de l’axe source est indisponible
Persisted source edge geometry is unavailable = La géométrie enregistrée de l’arête source est indisponible
Persisted source point geometry is unavailable = La géométrie enregistrée du point source est indisponible
Persisted source reference is ambiguous = La référence source enregistrée est ambiguë
Profile geometry requires an original edge reference. = La géométrie de profil nécessite une référence à une arête d’origine.
Project an original reference into a Sketch using its exact persisted identity. = Projeter une référence d’origine dans l’esquisse selon son identité enregistrée.
Refresh in-context Sketch dependencies with explicit document Regenerate. = Actualiser les dépendances contextuelles par une régénération explicite du document.
Source axis cannot be projected into the Sketch plane = L’axe source ne peut pas être projeté dans le plan d’esquisse
Source face has no unique intersection with the Sketch plane = La face source n’a pas d’intersection unique avec le plan d’esquisse
The Sketch external reference does not exist. = La référence externe d’esquisse n’existe pas.
The reference must identify an earlier Part object or an exact Assembly occurrence. = La référence doit désigner un objet Part antérieur ou une occurrence exacte de l’assemblage.

; Native Sketch text commands
Cannot decompose a font glyph outline. = Impossible de décomposer le contour du glyphe.
Cannot initialize the font outline engine. = Impossible d’initialiser le moteur de contours de police.
Cannot measure a font glyph outline. = Impossible de mesurer le contour du glyphe.
Cannot measure the bundled font cap height. = Impossible de mesurer la hauteur des capitales de la police fournie.
Cannot read a font glyph outline. = Impossible de lire le contour du glyphe.
Cannot read the bundled OSIFONT. = Impossible de lire la police OSIFONT fournie.
Cannot shape Sketch text. = Impossible de composer les glyphes du texte d’esquisse.
Create or edit Sketch text with native outlines of the bundled font. = Créer ou modifier un texte d’esquisse avec les contours natifs de la police fournie.
Read text properties, contour counts and bounds without rebuilding its glyphs. = Lire les propriétés, le nombre de contours et les limites sans recalculer les glyphes.
Sketch text contains unsupported control characters. = Le texte d’esquisse contient des caractères de contrôle non pris en charge.
Sketch text curve exceeds the subdivision budget. = La courbe de texte dépasse la limite de subdivision.
Sketch text dimensions must be finite and height must be positive. = Les dimensions du texte doivent être finies et sa hauteur positive.
Sketch text must be valid UTF-8. = Le texte d’esquisse doit être un UTF-8 valide.
Sketch text outline exceeds the point budget. = Le contour du texte dépasse la limite de points.
Sketch text supports at most 4096 Unicode characters. = Le texte d’esquisse accepte au maximum 4096 caractères Unicode.
Sketch text uses the bundled osifont font. = Le texte d’esquisse utilise la police osifont fournie.
Text color must be green, white, yellow or red. = La couleur doit être green, white, yellow ou red.
Text horizontal alignment must be left, center or right. = L’alignement horizontal doit être left, center ou right.
Text nevytváří žádný platný obrys. = Le texte ne produit aucun contour valide.
Text vertical alignment must be bottom, middle or top. = L’alignement vertical doit être bottom, middle ou top.
The Sketch text does not exist. = Le texte d’esquisse n’existe pas.
The bundled font does not contain a requested character. = La police fournie ne contient pas un caractère demandé.
The font glyph does not contain vector geometry. = Le glyphe ne contient pas de géométrie vectorielle.

; Native spline properties
Read spline properties, stable control points and exact parameterization. = Lit les propriétés de la spline, ses points de contrôle stables et sa paramétrisation exacte.
Edit spline properties while preserving identity, exact geometry and constraints. = Modifie les propriétés de la spline en conservant son identité, sa géométrie exacte et ses contraintes.
B-spline editing must preserve the number of control points. = La modification doit conserver le nombre de points de contrôle de la B-spline.
Edit the source reference, trim or offset instead of its generated spline. = Modifiez la référence source, le rognage ou le décalage de cette spline dérivée.
Exact spline degree and closure must retain their parameterization. = Le degré et la fermeture de la spline exacte doivent conserver sa paramétrisation.
Repeated spline points require identical coordinates. = Les points répétés de la spline doivent avoir des coordonnées identiques.
A fixed or source-driven spline point cannot be moved. = Un point de spline fixe ou piloté par une source ne peut pas être déplacé.
Spline properties conflict with the Sketch constraints. = Les propriétés de la spline sont incompatibles avec les contraintes de l’esquisse.

; Native Part imports
This import requires an open Part. = Cet import nécessite un Part ouvert.
Part import supports STEP, IGES and DXF. = L’import dans un Part prend en charge STEP, IGES et DXF.
The import source file does not exist. = Le fichier source à importer n’existe pas.
Only DXF can be imported into a Sketch. = Seul le format DXF peut être importé dans une esquisse.
The import runner did not complete the calculation. = La tâche d’import n’a pas terminé le calcul.
The target Part changed while importing; its current data was preserved. = Le Part cible a changé pendant l’import ; ses données actuelles ont été conservées.
Import cannot replace the target document identity. = L’import ne peut pas remplacer l’identité du document cible.
Import a source file into the active Part through the shared model transaction. = Importe un fichier dans le Part actif par la transaction commune du modèle.
This import requires an ordinary Part. = Cet import nécessite un Part ordinaire.
The source extension does not match the requested import format. = L’extension du fichier source ne correspond pas au format d’import demandé.
Import mesh deflection must be positive = La déviation du maillage importé doit être positive.

; Native model exports
Cannot create the export staging directory. = Impossible de créer le dossier temporaire d’export.
Model export supports STEP, STL and DXF. = L’export du modèle prend en charge STEP, STL et DXF.
The export destination directory does not exist. = Le dossier de destination de l’export n’existe pas.
The export destination already exists; request overwrite explicitly. = La destination de l’export existe déjà ; autorisez explicitement son remplacement.
A Sketch target is supported only for DXF export. = Une esquisse cible ne peut être spécifiée que pour l’export DXF.
Model export requires an open Part or Assembly. = L’export du modèle nécessite un Part ou un assemblage ouvert.
Specify the Sketch to export as DXF. = Indiquez l’esquisse à exporter en DXF.
The Part has no calculated body; invoke Regenerate first. = Le Part n’a pas de corps calculé ; lancez d’abord Régénérer.
There are no visible calculated bodies to export. = Aucun corps calculé visible n’est disponible pour l’export.
The exporter produced an empty file. = L’export a produit un fichier vide.
The export runner did not finish writing the file. = La tâche d’export n’a pas terminé l’écriture du fichier.
Export the persisted model snapshot without regenerating or modifying the document. = Exporte l’état enregistré du modèle sans régénérer ni modifier le document.
The destination extension does not match the requested export format. = L’extension du fichier cible ne correspond pas au format d’export demandé.
Exportuji %1… = Export de %1…

; Shared Assembly import commands
The import destination parent directory does not exist. = Le dossier parent de destination de l’import n’existe pas.
Assembly import requires a new destination directory. = L’import d’assemblage nécessite un nouveau dossier de destination.
An imported native file escaped its destination directory. = Un fichier natif importé se trouve hors du dossier de destination.
This import requires an open Assembly. = Cet import nécessite un assemblage ouvert.
Assembly import supports STEP, IGES and DXF. = L’import d’assemblage prend en charge STEP, IGES et DXF.
Assembly file import creates a new component; it cannot append to an existing Sketch. = L’import dans un assemblage crée un nouveau composant ; il ne peut pas compléter une esquisse existante.
The target Assembly changed while importing; its current data was preserved. = L’assemblage cible a changé pendant l’import ; ses données actuelles ont été conservées.
An imported source conflicts with an open document. = Une source importée entre en conflit avec un document ouvert.
The import runner did not finish writing the native documents. = La tâche d’import n’a pas terminé l’écriture des documents natifs.
Import a source file into the active Part or Assembly through the shared model transaction. = Importe un fichier source dans la pièce ou l’assemblage actif via la transaction de modèle commune.
This import requires an ordinary Part or Assembly. = Cet import nécessite une pièce ou un assemblage ordinaire.
A destination directory is supported only when importing into an Assembly. = Un dossier de destination ne peut être indiqué que pour un import dans un assemblage.
Import dokončen: %1 dílů, %2 podsestav = Import terminé : %1 pièces, %2 sous-assemblages

; Shared document metadata commands
Parameter keys must be nonempty, unique and contain no surrounding whitespace or control characters. = Les clés de paramètres doivent être uniques, non vides, sans espaces périphériques ni caractères de contrôle.
A document supports at most 4096 user parameters. = Un document accepte au maximum 4096 paramètres utilisateur.
Parameter labels and values must belong to an ordered parameter. = Les libellés et valeurs doivent appartenir à un paramètre de la liste ordonnée.
A parameter supports at most 128 language variants. = Un paramètre accepte au maximum 128 variantes linguistiques.
A parameter value is too long or contains a null character. = Une valeur de paramètre est trop longue ou contient un caractère nul.
Choose a supported unit for every document quantity. = Choisissez une unité prise en charge pour chaque grandeur du document.
All document precision values are required. = Toutes les valeurs de précision du document sont requises.
Decimal places must be an integer from 0 to 12. = Le nombre de décimales doit être un entier de 0 à 12.
Tolerances must be from 0 to 1000000; mesh deflection must be at least 0.000000001. = Les tolérances doivent être comprises entre 0 et 1000000 ; la déflexion du maillage doit être au moins 0,000000001.
Document metadata requires an open Part or Assembly. = Les métadonnées nécessitent une pièce ou un assemblage ouvert.
Metadata entries must be JSON objects with supported fields. = Les entrées de métadonnées doivent être des objets JSON avec des champs pris en charge.
Metadata values and labels must be objects of strings. = Les valeurs et libellés doivent être des objets contenant des chaînes de caractères.
Every parameter needs a string key. = Chaque paramètre nécessite une clé textuelle.
Specify document units or precision to update. = Indiquez les unités ou la précision du document à modifier.
Precision values must be finite numbers; decimal places must be an integer. = Les précisions doivent être des nombres finis ; le nombre de décimales doit être entier.
Cannot encode document precision. = Impossible de coder la précision du document.
Read ordered user parameters, shared values and language variants. = Lit les paramètres ordonnés, les valeurs partagées et les variantes linguistiques.
Replace the complete ordered parameter table without calculating geometry. = Remplace toute la table ordonnée des paramètres sans calculer la géométrie.
Read document units, tolerances and display precision. = Lit les unités, les tolérances et la précision d’affichage du document.
Update document units and precision, calculating affected local geometry when required. = Modifie les unités et la précision et calcule la géométrie locale concernée si nécessaire.
A document supports at most 4096 relations. = Un document accepte au maximum 4096 relations.
A family table supports at most 512 columns and 4096 instances. = Une table de famille accepte au maximum 512 colonnes et 4096 instances.
A family value refers to an unknown column. = Une valeur de variante désigne une colonne inconnue.
A material property supports at most 128 descriptions. = Une propriété de matériau accepte au maximum 128 descriptions.
A material supports at most 4096 properties. = Un matériau accepte au maximum 4096 propriétés.
A relation expression must contain 1 to 16384 bytes without null characters. = Une expression de relation doit contenir de 1 à 16384 octets sans caractère nul.
Every material property needs a string key, value and optional unit. = Chaque propriété de matériau exige une clé et une valeur textuelles, ainsi qu'une unité facultative.
Every relation needs a string target and expression. = Chaque relation exige une cible et une expression textuelles.
Family instance names must be unique and different from the generic document name. = Les noms des variantes doivent être uniques et différents du nom du document générique.
Family table columns must be unique. = Les colonnes de la table de famille doivent être uniques.
Invalid native family instance structure. = Structure native de variante incorrecte.
Invalid native family table structure. = Structure native de table de famille incorrecte.
Material density must be finite and positive. = La masse volumique du matériau doit être finie et positive.
Material descriptions must belong to an existing property. = Les descriptions de matériau doivent appartenir à une propriété existante.
Material property names must be unique. = Les noms des propriétés de matériau doivent être uniques.
Material units must belong to an existing property. = Les unités du matériau doivent appartenir à une propriété existante.
Metadata text is too long or contains a null character. = Le texte des métadonnées est trop long ou contient un caractère nul.
Read document material properties, units and localized descriptions. = Lire les propriétés du matériau du document, les unités et les descriptions traduites.
Read ordered parameter relations and cached physical values. = Lire les relations ordonnées des paramètres et les valeurs physiques mémorisées.
Read the stored family table without generating instances. = Lire la table de famille enregistrée sans générer d'instances.
Relation decimal places must be between 0 and 12. = Le nombre de décimales d'une relation doit être compris entre 0 et 12.
Relation expression nesting is too deep. = L'expression de relation est imbriquée trop profondément.
Relation target and expression are required = La cible et l'expression de la relation sont obligatoires.
Relation targets must be unique ASCII identifiers. = Les cibles des relations doivent être des identifiants ASCII uniques.
Replace and evaluate parameter relations without calculating geometry. = Remplacer et évaluer les relations des paramètres sans calculer la géométrie.
Replace material data and update cached physical relations. = Remplacer les données du matériau et actualiser les relations physiques mémorisées.
Replace the stored family table without generating geometry. = Remplacer la table de famille enregistrée sans générer de géométrie.
The material property unit is not supported. = L'unité de la propriété du matériau n'est pas prise en charge.
Metadata keys contain a reserved native file separator. = Les clés des métadonnées contiennent un séparateur réservé du fichier natif.
Native metadata values must be single lines without surrounding spaces or tabs. = Les valeurs des métadonnées natives doivent tenir sur une ligne sans espaces ni tabulations au début ou à la fin.
A native material library requires the .matz extension. = Une bibliothèque native de matériaux exige l'extension .matz.
The material library must be an existing regular file. = La bibliothèque de matériaux doit être un fichier ordinaire existant.
Cannot open the material library. = Impossible d'ouvrir la bibliothèque de matériaux.
The material library must contain 1 byte to 16 MiB. = La bibliothèque de matériaux doit avoir une taille comprise entre 1 octet et 16 Mio.
The material library changed or could not be read completely. = La bibliothèque de matériaux a changé ou n'a pas pu être lue entièrement.
The material library must be valid UTF-8 text without null characters. = La bibliothèque de matériaux doit être un texte UTF-8 valide sans caractère nul.
Unknown section in the native material library. = Section inconnue dans la bibliothèque native de matériaux.
Duplicate section or key in the native material library. = Section ou clé en double dans la bibliothèque native de matériaux.
Invalid native material library line. = Ligne incorrecte dans la bibliothèque native de matériaux.
The material library requires a name and a Properties section. = La bibliothèque de matériaux exige un nom et une section Properties.
The material name must be declared only in the Material section. = Le nom du matériau doit être déclaré uniquement dans la section Material.
Load a native material library into the document without retaining a file dependency. = Charger une bibliothèque native de matériaux dans le document sans conserver de dépendance au fichier.
Component insertion would create a dependency cycle. = L'insertion du composant créerait un cycle de dépendances.
The component dependency graph is too large or too deep. = Le graphe des dépendances du composant est trop grand ou trop profond.
Open the referenced source documents before inserting this component. = Ouvrez les documents sources référencés avant d'insérer ce composant.
The component source file belongs to a different document. = Le fichier source du composant appartient à un autre document.
Component insertion requires an open owning Assembly. = L'insertion d'un composant exige une assemblée propriétaire ouverte.
Open the owning Assembly in its own tab before inserting a component. = Ouvrez l'assemblée propriétaire dans son propre onglet avant d'insérer un composant.
The component source must be an open Part or Assembly. = La source du composant doit être une pièce ou une assemblée ouverte.
A component name must contain 1 to 256 bytes. = Le nom d'un composant doit contenir de 1 à 256 octets.
Unknown component source kind. = Type de source du composant inconnu.
Component commands require an open Assembly. = Les commandes de composants exigent une assemblée ouverte.
List component occurrences from the stored Assembly hierarchy. = Lister les occurrences de composants de la hiérarchie d'assemblée enregistrée.
Component query limit must be from 1 to 10000. = La limite de la requête de composants doit être comprise entre 1 et 10000.
Read one exact persisted occurrence and its available component data. = Lire une occurrence enregistrée précise et les données disponibles de son composant.
The requested component occurrence does not exist. = L'occurrence de composant demandée n'existe pas.
Insert an open Part or Assembly through the shared native insertion transaction. = Insérer une pièce ou une assemblée ouverte par la transaction native commune.
The selected component has no available native source file. = Le composant sélectionné ne possède pas de fichier source natif disponible.
The owning Assembly changed while its component source was being opened. = L'assemblée propriétaire ou le document actif a changé pendant l'ouverture de la source du composant.
Native source reading did not complete. = La lecture de la source native n'a pas été terminée.
Open the native source of an exact component occurrence without regenerating it. = Ouvrir la source native d'une occurrence précise de composant sans la régénérer.

Drawing commands require an open Drawing. = Les commandes nécessitent un dessin ouvert.
The drawing sheet does not exist. = La feuille de dessin n’existe pas.
Drawing names and language codes must be non-empty bounded single-line text. = Le nom et le code de langue doivent être des textes non vides sur une ligne de longueur autorisée.
Invalid drawing sheet format or projection method. = Format de feuille ou méthode de projection non valide.
Drawing sheet scale must be from 0.001 to 1000. = L’échelle doit être comprise entre 0,001 et 1000.
Drawing line widths must be from 0.05 to 2 mm. = Les épaisseurs de trait doivent être comprises entre 0,05 et 2 mm.
The last drawing sheet cannot be removed. = La dernière feuille ne peut pas être supprimée.
Another drawing sheet contains a dependent view. = Une autre feuille contient une vue dépendante.
A stored source model is required to update section hatching. = Un modèle source calculé est nécessaire pour actualiser les hachures.
Use a native frmz frame or tblz title-block template. = Utilisez un cadre frmz ou un cartouche tblz natif.
The drawing source file belongs to a different document. = Le fichier source appartient à un autre document.
Drawing sources must be Parts or Assemblies. = La source doit être une pièce ou un assemblage.
The Part has no saved calculated model. Regenerate and save it first. = La pièce n’a pas de modèle calculé enregistré. Régénérez-la et enregistrez-la.
Drawing sources must be native prtz or asmz files. = Les sources doivent être des fichiers natifs prtz ou asmz.
Read the stored properties of one drawing sheet. = Lit les propriétés enregistrées d’une feuille.
List stored drawing sheets without projection or source loading. = Liste les feuilles sans projection ni chargement des sources.
Create a drawing sheet with explicit paper settings. = Crée une feuille avec les paramètres de papier indiqués.
Edit drawing sheet settings through the shared sheet operation. = Modifie les paramètres par l’opération commune du modèle.
Delete one drawing sheet and its contained views and dimensions. = Supprime une feuille avec ses vues et ses cotes.
Remove the embedded drawing template geometry. = Supprime la géométrie de modèle incorporée.
Load and embed a native drawing template. = Charge et incorpore un modèle de dessin natif.

List original measuring references stored with a drawing view. = Liste les références de mesure originales enregistrées dans une vue.
Read stored drawing views without loading source models. = Lit les vues enregistrées sans charger les modèles sources.
Drawing query limit must be from 1 to 10000. = La limite de requête doit être comprise entre 1 et 10000.
Drawing reference kind must be all, curve or point. = Le type de référence doit être all, curve ou point.
Delete a drawing view, its projected descendants and their dimensions. = Supprime une vue, ses projections dérivées et leurs cotes.
The source Section no longer exists. Edit the drawing view first. = La coupe source n’existe plus. Modifiez d’abord la vue.
A source section trace no longer exists. Edit the drawing view first. = Une trace de coupe source n’existe plus. Modifiez d’abord la vue.
The drawing projection hierarchy is too deep. = La hiérarchie des projections est trop profonde.
Drawing views contain a cyclic dependency. = Les vues contiennent une dépendance cyclique.
The parent drawing view is unavailable. = La vue parente n’est pas disponible.
A projected view must use its parent source document. = Une projection doit utiliser le document source de sa vue parente.
The drawing view does not exist. = La vue de dessin n’existe pas.

The source has no calculated geometry. Regenerate it first. = La source ne contient aucune géométrie calculée. Régénérez-la d’abord.
Invalid drawing view parameters. = Paramètres de vue de dessin incorrects.
Create a drawing view from a calculated source or a parent view. = Crée une vue à partir d’une source calculée ou d’une vue parente.
Edit a drawing view and update its projected descendants. = Modifie une vue et actualise ses vues projetées dérivées.
A source document or parent view is required. = Un document source ou une vue parente est nécessaire.
A projected view inherits its source and camera; use distance_mm for its position. = Une vue projetée hérite de sa source et de sa caméra ; utilisez distance_mm pour sa position.
The drawing source must be an open Part or Assembly. = La source du dessin doit être une pièce ou un assemblage ouvert.

Úhlová = Angulaire
Vyberte dvě přímé hrany pro úhlovou kótu. = Sélectionnez deux arêtes droites pour la cote angulaire.
Chybí přímá hrana úhlové kóty. Vyberte její náhradu. = Une arête de la cote angulaire est indisponible. Sélectionnez son remplacement.
Vyberte dvě různé přímé hrany. = Sélectionnez deux arêtes droites distinctes.

Invalid Show/Erase arguments. = Arguments Afficher/Masquer non valides.
An annotation may be specified only once per view. = Une annotation ne peut être indiquée qu’une fois par vue.
The drawing annotation reference is ambiguous. = La référence de l’annotation du dessin est ambiguë.
The drawing annotation does not exist. = L’annotation du dessin n’existe pas.
An unresolved drawing annotation cannot change visibility. = La visibilité d’une annotation dont la référence est introuvable ne peut pas être modifiée.
Each Show/Erase batch may include a view only once. = Un lot Afficher/Masquer ne peut inclure chaque vue qu’une fois.
Invalid Show/Erase mode or selection. = Mode ou sélection Afficher/Masquer non valide.
Invalid drawing annotation kind. = Type d’annotation de dessin non valide.
The selected annotation is not offered by Show/Erase. = L’annotation sélectionnée n’est pas proposée par Afficher/Masquer.
List stored model annotations and Show/Erase candidates without source loading. = Liste les annotations de modèle enregistrées et les candidats Afficher/Masquer sans charger la source.
Apply shared Show/Erase selections to one or more drawing views. = Applique les sélections Afficher/Masquer communes à une ou plusieurs vues du dessin.

List measured drawing dimensions and their resolved or last valid values. = Liste les cotes mesurées du dessin et leurs valeurs actuelles ou dernières valeurs valides.
Read measured dimension references, style, layout and reference validity. = Lit les références, le style, la disposition et la validité des références d’une cote mesurée.
Delete a measured drawing dimension with shared GUI history behavior. = Supprime une cote mesurée du dessin avec l’historique commun de l’interface.
The measured drawing dimension does not exist. = La cote mesurée du dessin n’existe pas.

Invalid measured drawing dimension parameters. = Paramètres de cote mesurée du dessin non valides.
The measured drawing dimension already exists. = La cote mesurée du dessin existe déjà.
The dimension view must belong to its drawing sheet. = La vue de la cote doit appartenir à sa feuille de dessin.
Create a measured dimension from original drawing references. = Crée une cote mesurée à partir des références d’origine du dessin.
Extend a measured dimension chain while preserving existing segment identities. = Étend une chaîne de cotes en conservant les identités des segments existants.
Edit measured dimension references, style and placement. = Modifie les références, le style et le placement d’une cote mesurée.

The title block or source parameter changed. Reopen its properties. = Le cartouche ou le paramètre source a changé. Rouvrez ses propriétés.
The stored BOM row does not exist. = La ligne enregistrée de la nomenclature n’existe pas.
Regenerate the drawing before editing this changed BOM row. = Régénérez le dessin avant de modifier cette ligne de nomenclature modifiée.
The drawing source document identity changed. = L’identité du document source du dessin a changé.
The title block field does not exist. = Le champ du cartouche n’existe pas.
The title block field is read-only. = Le champ du cartouche est en lecture seule.
Conflicting values for one title block parameter. = Valeurs contradictoires pour un même paramètre du cartouche.
Open the source model in the workspace to edit its parameters. = Ouvrez le modèle source dans l’espace de travail pour modifier ses paramètres.
The source model is unavailable. = Le modèle source est indisponible.
Invalid title block field values. = Valeurs de champs du cartouche incorrectes.
List stored BOM rows and their exact source documents without loading sources. = Liste les lignes enregistrées de la nomenclature et leurs documents sources exacts sans charger les sources.
Edit title block or BOM source parameters with shared GUI validation. = Modifie les paramètres sources du cartouche ou de la nomenclature avec la validation partagée de l’interface.
Read title block fields and writable parameters from the authoritative source. = Lit les champs du cartouche et les paramètres modifiables depuis la source faisant autorité.

Read the shared removal blockers of an immediate Assembly component. = Lit les dépendances bloquant la suppression d’un composant direct de l’assemblage.
Query component dependencies in its immediate owning Assembly. = Interrogez les dépendances du composant dans son assemblage propriétaire immédiat.

Export every Drawing sheet to PDF without regenerating geometry. = Exporte toutes les feuilles du dessin en PDF sans recalculer la géométrie.
PDF export requires an open Drawing. = L’export PDF nécessite un dessin ouvert.
PDF export requires an initialized graphics runtime. = L’export PDF nécessite un environnement graphique initialisé.
Drawing has no sheets = Le dessin ne contient aucune feuille
Cannot start PDF output = Impossible de démarrer la sortie PDF
Cannot add PDF page = Impossible d’ajouter une page PDF
Cannot finish PDF output = Impossible de terminer la sortie PDF

Drawing DXF export requires an initialized graphics runtime. = L’export DXF du dessin nécessite un environnement graphique initialisé.
Drawing DXF export requires a sheet ID and does not accept a sketch. = L’export DXF du dessin exige un identifiant de feuille et n’accepte pas d’esquisse.
Sketch DXF export requires a sketch ID and does not accept a drawing sheet. = L’export DXF de l’esquisse exige un identifiant d’esquisse et n’accepte pas de feuille de dessin.
Cannot start DXF output = Impossible de démarrer la sortie DXF
Cannot finish DXF output = Impossible de terminer la sortie DXF
Cannot write DXF output = Impossible d’écrire la sortie DXF

Export a Drawing sheet or paper crop to PNG or JPEG without regeneration. = Exporte une feuille de dessin ou une zone du papier en PNG ou JPEG sans recalcul.
Sheet image export requires an open Drawing. = L’export d’image de feuille nécessite un dessin ouvert.
Image export requires a PNG or JPEG destination. = L’export d’image exige un fichier de destination PNG ou JPEG.
Invalid image export settings. = Paramètres d’export d’image non valides.
Cannot export an empty image. = Impossible d’exporter une image vide.
Requested image exceeds the raster size limit. = L’image demandée dépasse la limite de taille raster.
Image export requires an initialized graphics runtime. = L’export d’image nécessite un environnement graphique initialisé.
Cannot allocate the requested image. = Impossible d’allouer la mémoire pour l’image demandée.
Cannot finish image output = Impossible de terminer la sortie d’image

The target document changed while importing the Sketch; its current data was preserved. = Le document cible a changé pendant l’import de l’esquisse ; ses données actuelles ont été conservées.
A Sketch import does not create an output directory. = L’import dans une esquisse ne crée pas de dossier de sortie.

An exported component has no calculated body; invoke Regenerate first. = Un composant à exporter ne possède pas de corps calculé ; lancez d’abord Régénérer.

DXF export does not yet support Sketch text or corner fillets. = L’export DXF ne prend pas encore en charge le texte d’esquisse ni les congés de coin.

SPLINE: DXF spline degree or array counts are invalid. = SPLINE : degré ou tailles de tableaux DXF invalides.
SPLINE: DXF spline control points must lie in XY. = SPLINE : les points de contrôle DXF doivent être dans le plan XY.
SPLINE: DXF spline control data is invalid or not clamped. = SPLINE : données de contrôle DXF invalides ou vecteur de nœuds non bridé.
SPLINE: Closed DXF spline endpoints do not coincide. = SPLINE : les extrémités de la spline DXF fermée ne coïncident pas.
ELLIPSE: DXF ellipse axes or parameter interval are invalid. = ELLIPSE : axes ou intervalle de paramètres DXF invalides.
XLINE: DXF axis direction is invalid. = XLINE : direction de l’axe DXF invalide.

Construction queries require an open Part or Assembly. = Les requêtes de construction nécessitent une pièce ou un assemblage ouvert.
Construction pagination is outside the supported range. = La pagination des constructions dépasse la plage prise en charge.
Construction kind must be point, axis, plane or curve3d. = Le type de construction doit être point, axis, plane ou curve3d.
The requested construction object does not exist in this document. = L’objet de construction demandé n’existe pas dans ce document.
List stored construction objects and their owned points without calculation. = Lister les objets de construction enregistrés et leurs points sans calcul.
Read stored construction geometry, references and curve point parameters. = Lire la géométrie de construction enregistrée, les références et les paramètres des points de courbe.

Placement value must be finite. = La valeur de placement doit être un nombre fini.
Editing must preserve the construction identity. = La modification doit conserver l’identité de la construction.
A new construction must have a new root identity. = Une nouvelle construction doit avoir une nouvelle identité racine.
The placement parameter is unknown, constrained or locked. = Le paramètre de placement est inconnu, contraint ou verrouillé.
Placement operations require an open Part or Assembly. = Les opérations de placement nécessitent une pièce ou un assemblage ouvert.
The object has no supported placement in this document. = L’objet n’a pas de placement pris en charge dans ce document.
Specify at least one placement parameter. = Indiquez au moins un paramètre de placement.
Activate the owning Body before editing its placement. = Activez le corps propriétaire avant de modifier le placement.
Read stored Body, feature or construction placement without calculation. = Lire le placement enregistré d’un corps, d’une fonction ou d’une construction sans calcul.
Edit placement dimensions using the shared reference solver; values are mm or degrees. = Modifier les dimensions de placement avec le solveur de références commun ; valeurs en mm ou degrés.
Placement parameters must be JSON numbers. = Les paramètres de placement doivent être des nombres JSON.

Activate the owning Body before editing a construction. = Activez le corps propriétaire avant de modifier une construction.
This property is unavailable for the construction kind. = Cette propriété ne s’applique pas à ce type de construction.
Construction dimension is outside the supported range. = La dimension de construction dépasse les limites autorisées.
The construction dimension is locked. = La dimension de construction est verrouillée.
Construction axis must be x, y or z. = L’axe de construction doit être x, y ou z.
Construction plane must be xy, xz or yz. = Le plan de construction doit être xy, xz ou yz.
Placement parameters must be finite JSON numbers. = Les paramètres de placement doivent être des nombres JSON finis.
Specify at least one construction property. = Indiquez au moins une propriété de construction.
New construction kind must be point, axis or plane. = Le type de la nouvelle construction doit être point, axis ou plane.
Create an absolute Point, Axis or Plane using the shared Properties transaction. = Créer un point, un axe ou un plan absolu avec la transaction commune des propriétés.
Edit construction properties and placement in one transaction. = Modifier les propriétés et le placement d’une construction en une transaction.
Construction operations require an open Part or Assembly. = Les opérations de construction nécessitent une pièce ou un assemblage ouvert.
