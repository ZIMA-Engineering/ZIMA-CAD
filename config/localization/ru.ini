Read Part history, ownership, suppression and calculation errors. = Прочитать историю детали, принадлежность, подавление и ошибки вычисления.
Set suppression of a history object and calculate the Part. = Задать подавление объекта истории и вычислить деталь.
Delete a history object, Body or Boolean and calculate the Part. = Удалить объект истории, тело или булеву операцию и вычислить деталь.
Move an object before another in the same history; omit before for the end. = Переместить объект перед другим в той же истории; без before — в конец.
Check history order and dependencies without calculating geometry. = Проверить порядок и зависимости истории без вычисления геометрии.
Set the insertion index in the flattened Part history. = Задать индекс вставки в общем порядке истории детали.
Activate the owning Body before editing its history. = Перед изменением истории активируйте соответствующее тело.
The requested history object does not exist or is owned by a feature. = Объект истории не существует или принадлежит элементу.
The object and destination must belong to the same history scope. = Объект и место назначения должны принадлежать одной области истории.
The move would break a history dependency. = Перемещение нарушит зависимость в истории.
The history index is outside the document history. = Индекс находится за пределами истории документа.
The first feature of a Body cannot be subtractive. = Первый элемент тела не может быть вычитающим.
The move would remove a persisted reference. = Перемещение удалит сохранённую ссылку.
The move would remove original reference geometry. = Перемещение удалит исходную опорную геометрию.
The move would break a construction reference. = Перемещение нарушит ссылку вспомогательного элемента.
The move would break a container reference. = Перемещение нарушит ссылку контейнера.
The move would break an external Sketch reference. = Перемещение нарушит внешнюю ссылку эскиза.

; Original reference queries
Reference queries require an open Part or Assembly. = Для запросов ссылок требуется открытая деталь или сборка.
Reference pagination is outside the supported range. = Параметры страниц ссылок выходят за допустимые пределы.
Reference kind must be face, edge, point or axis. = Тип ссылки должен быть face, edge, point или axis.
The persisted reference geometry is incomplete. = Сохранённая опорная геометрия неполная.
List persisted original faces, edges, points and axes without calculation. = Вывести сохранённые исходные грани, рёбра, точки и оси без вычисления.
Read one original reference and its bounded persisted geometry in document coordinates. = Прочитать исходную ссылку и ограниченный объём её геометрии в координатах документа.
The exact original reference was not found in the stored document state. = Точная исходная ссылка не найдена в сохранённом состоянии документа.

; Shared Sketch geometry commands
A B-spline requires 2 to 4096 points. = B-сплайн требует от 2 до 4096 точек.
A Sketch name must contain 1 to 1024 UTF-8 bytes. = Имя эскиза должно содержать от 1 до 1024 байтов UTF-8.
A new Part Sketch must have its own Sketch container. = Новый эскиз детали должен иметь собственный контейнер эскиза.
A point must be [x, y] in Sketch millimetres. = Точка задаётся как [x, y] в миллиметрах эскиза.
A standalone Assembly Sketch cannot own a cut container. = Отдельный эскиз сборки не может владеть контейнером выреза.
Add a constrained native rectangle from opposite corners. = Добавить прямоугольник со связями по противоположным углам.
Add a native B-spline from control or interpolation points. = Добавить B-сплайн по управляющим или интерполяционным точкам.
Add a native point in Sketch coordinates (mm). = Добавить точку в координатах эскиза (мм).
Add a native segment between two Sketch points (mm). = Добавить отрезок между двумя точками эскиза (мм).
Add a regular polygon using a center and rim point. = Добавить правильный многоугольник по центру и точке на контуре.
Add an exact circle with radius in millimetres. = Добавить точную окружность с радиусом в миллиметрах.
Add an exact circular arc through start and end points. = Добавить точную дугу окружности по начальной и конечной точкам.
Add exact elliptical geometry from its center and axis endpoints. = Добавить точную эллиптическую геометрию по центру и концам осей.
An ID list must contain at most 4096 strings. = Список ID может содержать не более 4096 строк.
An ID list must contain nonempty strings. = Список ID должен содержать непустые строки.
Coordinates must be finite numbers in millimetres. = Координаты должны быть конечными числами в миллиметрах.
Create a standalone Sketch using the standard container factory. = Создать отдельный эскиз стандартным способом создания контейнера.
Delete native Sketch geometry using the Sketcher's dependency rules. = Удалить геометрию эскиза по правилам её зависимостей.
Each B-spline point must be [x, y]. = Каждая точка B-сплайна должна иметь вид [x, y].
Edit this Sketch through its owning section operation. = Измените этот эскиз через операцию его сечения.
Integer argument is outside its allowed range. = Целочисленный аргумент вне допустимого диапазона.
List persisted Sketches without calculating geometry. = Вывести сохранённые эскизы без расчёта геометрии.
List stable Sketch entity IDs and kinds. = Вывести постоянные ID и типы элементов эскиза.
Move a native point subject to its constraints. = Переместить точку с учётом её связей.
Read Sketch metadata and geometry counts. = Прочитать данные эскиза и количество геометрических элементов.
Read one persisted Sketch entity; lengths use millimetres. = Прочитать сохранённый элемент эскиза; длины в миллиметрах.
Remove a native point and its dependent Sketch geometry. = Удалить точку и зависимую геометрию эскиза.
Set a native point's fixed state. = Задать фиксацию точки.
Set a native segment's unbounded centerline state. = Включить или выключить представление отрезка бесконечной осью.
Set the auxiliary state of native Sketch geometry. = Задать вспомогательное состояние геометрии эскиза.
Sketch commands require an ordinary Part or Assembly. = Команды эскиза требуют обычную деталь или сборку.
Sketch creation requires the active document. = Создание эскиза требует активный документ.
Sketch operations require an open Part or Assembly. = Операции эскиза требуют открытую деталь или сборку.
Sketch plane must be XY, XZ or YZ. = Плоскость эскиза должна быть XY, XZ или YZ.
Snap tolerance must be positive millimetres. = Допуск привязки должен быть положительным, в миллиметрах.
The Sketch entity does not exist. = Элемент эскиза не существует.
The Sketch identity already exists. = Идентификатор эскиза уже существует.
The entity exceeds the 64 KiB query limit. = Элемент превышает предел запроса 64 КиБ.
The native Sketch geometry does not exist. = Геометрия эскиза не существует.
The native Sketch point does not exist. = Точка эскиза не существует.
The point cannot move to the requested position. = Точку нельзя переместить в заданное положение.
The requested Sketch does not exist. = Запрошенный эскиз не существует.
The selection cannot translate by the requested displacement. = Выбор нельзя переместить на заданное смещение.
Translate native Sketch points and geometry subject to constraints. = Переместить точки и геометрию эскиза с учётом связей.
Translation requires at least one native point or geometry ID. = Перемещение требует хотя бы один ID точки или геометрии.

; Sketch offset and curve operations
The native Sketch offset does not exist. = Смещение эскиза не существует.
Retain requires 1 to 1024 nonoverlapping intervals. = Сохранение кривой требует от 1 до 1024 неперекрывающихся интервалов.
Each retained interval must be [start, end] inside [0, 1]. = Каждый сохраняемый интервал должен быть [start, end] в пределах [0, 1].
Retained intervals must not overlap. = Сохраняемые интервалы не должны перекрываться.
Offset a native Sketch curve; distance is positive millimetres. = Сместить кривую эскиза на положительное расстояние в миллиметрах.
Edit all retained pieces of one Sketch offset operation. = Изменить все сохранённые части одного смещения эскиза.
Read an offset's source, retained interval and repair state. = Прочитать источник смещения, сохранённый интервал и состояние ссылки.
Detach an offset while preserving its current curve and identity. = Освободить смещение с сохранением кривой и её идентификатора.
Read a curve's complete supporting spline and visible interval. = Прочитать полный опорный сплайн и видимый интервал кривой.
Retain explicit curve intervals while preserving the original supporting geometry. = Сохранить заданные интервалы кривой и исходную опорную геометрию.
List current intersection-bounded curve pieces for explicit trimming. = Вывести текущие участки кривых между пересечениями для обрезки.
Remove explicitly identified current trim pieces; stale intervals are rejected. = Удалить точно заданные участки; устаревшие интервалы отклоняются.
Trim requires 1 to 2048 piece identities. = Обрезка требует от 1 до 2048 идентификаторов участков.
Each trim identity requires exactly geometry, start and end. = Идентификатор участка требует ровно geometry, start и end.
A trim piece cannot be selected twice. = Участок нельзя выбрать для обрезки дважды.
The requested trim piece no longer exists; read the current pieces. = Запрошенный участок больше не существует; прочитайте текущие участки.
Mirror native Sketch entities about an explicitly identified Sketch axis. = Отразить элементы эскиза относительно точно заданной оси.
Mirror requires native Sketch entities. = Отражение требует собственные элементы эскиза.
Create an oriented rectangle using a Sketch symmetry axis. = Создать ориентированный прямоугольник по оси симметрии эскиза.
Create a circular arc tangent to an explicitly identified curve. = Создать дугу окружности, касательную к заданной кривой.
Create a common tangent segment using two curves and contact hints. = Создать общую касательную двух кривых с указанием мест касания.
Round a Sketch corner without destroying its source segments. = Скруглить угол эскиза с сохранением исходных отрезков.

; Sketch constraints and solver
Create a native Sketch relation using explicitly ordered points and geometry. = Создать связь эскиза с явно заданным порядком точек и геометрии.
The constraint requires a different number of points or geometry references. = Связь требует другое количество точек или геометрических ссылок.
Tangency requires two curves and at most one contact point. = Касание требует две кривые и не более одной точки контакта.
Unknown Sketch constraint kind. = Неизвестный тип связи эскиза.
Remove a Sketch relation and solve its remaining constraints. = Удалить связь эскиза и решить оставшиеся связи.
Explicitly solve a Sketch without calculating a solid body. = Явно решить эскиз без расчёта твёрдого тела.
The Sketch constraints could not be solved; no change was committed. = Связи эскиза не удалось решить; изменения не внесены.
Inspect constraint residual and free degrees of freedom on a temporary Sketch copy. = Проверить невязку связей и степени свободы на временной копии эскиза.

; Sketch dimension commands
A symmetric line dimension requires an axis and one or two lines. = Симметричный размер линий требует ось и одну или две линии.
A symmetric point dimension requires one or two points and an axis. = Симметричный размер точек требует одну или две точки и ось.
Create or edit Sketch dimension properties; lengths use mm and angles degrees. = Создание или изменение размера эскиза; длины в мм, углы в градусах.
Dimension angle sector must be -1, 0 or 1. = Угловой сектор размера должен быть -1, 0 или 1.
Dimension label layout must belong to the edited Sketch. = Расположение подписи размера должно принадлежать редактируемому эскизу.
Dimension layout flags must be booleans. = Параметры-переключатели расположения размера должны быть логическими.
Dimension limits accept only lower and upper. = Границы размера принимают только lower и upper.
Dimension solution side must be -1 or 1. = Сторона решения размера должна быть -1 или 1.
Dimension text accepts known string fields of at most 2048 bytes. = Текст размера принимает известные строковые поля длиной до 2048 байт.
Read a Sketch dimension's parameters, references and label layout. = Чтение параметров, ссылок и расположения подписи размера эскиза.
Remove a Sketch dimension using the native solver transaction. = Удаление размера эскиза через штатную транзакцию решателя.
The Sketch dimension does not exist. = Размер эскиза не существует.
The dimension requires a different number of points or geometry references. = Для размера требуется другое число точек или геометрических ссылок.
The selected axis does not match the requested coordinate dimension. = Выбранная ось не соответствует запрошенному координатному размеру.
Unknown Sketch dimension kind. = Неизвестный вид размера эскиза.
Unknown dimension label layout field. = Неизвестное поле расположения подписи размера.
Unknown dimension tolerance mode. = Неизвестный режим допуска размера.
Angular dimension plane is defined by its measured rays = Плоскость углового размера определяется его измеряемыми лучами

; Sketch external reference commands
Create native profile geometry linked to an existing projected edge. = Создание собственной геометрии профиля, связанной с проекцией ребра.
Detach an external reference while preserving its native profile curves. = Отсоединение внешней ссылки с сохранением собственных кривых профиля.
Edit an in-context reference in its owning Assembly context. = Редактируйте контекстную ссылку в контексте её сборки-владельца.
Explicitly refresh a Sketch's references from its document's calculated snapshot. = Явное обновление ссылок эскиза из рассчитанного состояния документа.
Persisted source axis geometry is unavailable = Сохранённая геометрия исходной оси недоступна
Persisted source edge geometry is unavailable = Сохранённая геометрия исходного ребра недоступна
Persisted source point geometry is unavailable = Сохранённая геометрия исходной точки недоступна
Persisted source reference is ambiguous = Сохранённая исходная ссылка неоднозначна
Profile geometry requires an original edge reference. = Геометрия профиля требует ссылку на исходное ребро.
Project an original reference into a Sketch using its exact persisted identity. = Проекция исходной ссылки в эскиз по её точной сохранённой идентичности.
Refresh in-context Sketch dependencies with explicit document Regenerate. = Обновите контекстные зависимости эскиза явной регенерацией документа.
Source axis cannot be projected into the Sketch plane = Исходную ось нельзя спроецировать в плоскость эскиза
Source face has no unique intersection with the Sketch plane = Исходная грань не имеет однозначного пересечения с плоскостью эскиза
The Sketch external reference does not exist. = Внешняя ссылка эскиза не существует.
The reference must identify an earlier Part object or an exact Assembly occurrence. = Ссылка должна указывать на предыдущий объект детали или точное вхождение в сборку.

; Native Sketch text commands
Cannot decompose a font glyph outline. = Не удалось разложить контур символа шрифта.
Cannot initialize the font outline engine. = Не удалось инициализировать модуль контуров шрифта.
Cannot measure a font glyph outline. = Не удалось измерить контур символа шрифта.
Cannot measure the bundled font cap height. = Не удалось измерить высоту прописных букв встроенного шрифта.
Cannot read a font glyph outline. = Не удалось прочитать контур символа шрифта.
Cannot read the bundled OSIFONT. = Не удалось прочитать встроенный OSIFONT.
Cannot shape Sketch text. = Не удалось сформировать текст эскиза.
Create or edit Sketch text with native outlines of the bundled font. = Создание или изменение текста эскиза с собственными контурами встроенного шрифта.
Read text properties, contour counts and bounds without rebuilding its glyphs. = Чтение свойств, числа контуров и границ текста без пересоздания символов.
Sketch text contains unsupported control characters. = Текст эскиза содержит неподдерживаемые управляющие символы.
Sketch text curve exceeds the subdivision budget. = Кривая текста эскиза превышает предел подразделения.
Sketch text dimensions must be finite and height must be positive. = Размеры текста должны быть конечными, а высота — положительной.
Sketch text must be valid UTF-8. = Текст эскиза должен быть корректным UTF-8.
Sketch text outline exceeds the point budget. = Контур текста эскиза превышает предел числа точек.
Sketch text supports at most 4096 Unicode characters. = Текст эскиза поддерживает не более 4096 символов Unicode.
Sketch text uses the bundled osifont font. = Текст эскиза использует встроенный шрифт osifont.
Text color must be green, white, yellow or red. = Цвет текста должен быть green, white, yellow или red.
Text horizontal alignment must be left, center or right. = Горизонтальное выравнивание должно быть left, center или right.
Text nevytváří žádný platný obrys. = Текст не создаёт допустимого контура.
Text vertical alignment must be bottom, middle or top. = Вертикальное выравнивание должно быть bottom, middle или top.
The Sketch text does not exist. = Текст эскиза не существует.
The bundled font does not contain a requested character. = Встроенный шрифт не содержит запрошенного символа.
The font glyph does not contain vector geometry. = Символ шрифта не содержит векторной геометрии.

; Native spline properties
Read spline properties, stable control points and exact parameterization. = Читает свойства сплайна, устойчивые контрольные точки и точную параметризацию.
Edit spline properties while preserving identity, exact geometry and constraints. = Изменяет свойства сплайна с сохранением идентичности, точной геометрии и связей.
B-spline editing must preserve the number of control points. = Редактирование B-сплайна должно сохранять число контрольных точек.
Edit the source reference, trim or offset instead of its generated spline. = Измените исходную ссылку, обрезку или смещение этого производного сплайна.
Exact spline degree and closure must retain their parameterization. = Степень и замкнутость точного сплайна должны сохранять его параметризацию.
Repeated spline points require identical coordinates. = Повторяющиеся точки сплайна должны иметь одинаковые координаты.
A fixed or source-driven spline point cannot be moved. = Фиксированную или управляемую источником точку сплайна нельзя перемещать.
Spline properties conflict with the Sketch constraints. = Свойства сплайна противоречат связям эскиза.

; Native Part imports
This import requires an open Part. = Для этого импорта требуется открытый Part.
Part import supports STEP, IGES and DXF. = Импорт в Part поддерживает STEP, IGES и DXF.
The import source file does not exist. = Исходный файл импорта не существует.
Only DXF can be imported into a Sketch. = В эскиз можно импортировать только DXF.
The import runner did not complete the calculation. = Задача импорта не завершила расчёт.
The target Part changed while importing; its current data was preserved. = Целевой Part изменился во время импорта; его текущие данные сохранены.
Import cannot replace the target document identity. = Импорт не может заменить идентичность целевого документа.
Import a source file into the active Part through the shared model transaction. = Импортирует файл в активный Part через общую транзакцию модели.
This import requires an ordinary Part. = Для этого импорта требуется обычный Part.
The source extension does not match the requested import format. = Расширение исходного файла не соответствует выбранному формату импорта.
Import mesh deflection must be positive = Отклонение сетки при импорте должно быть положительным.

; Native model exports
DXF export currently supports segments, circles and circular arcs; other geometry would be lost. = Экспорт DXF пока поддерживает отрезки, окружности и дуги окружностей; другая геометрия была бы потеряна.
Cannot create the export staging directory. = Не удалось создать временный каталог экспорта.
Model export supports STEP, STL and DXF. = Экспорт модели поддерживает STEP, STL и DXF.
The export destination directory does not exist. = Целевой каталог экспорта не существует.
The export destination already exists; request overwrite explicitly. = Целевой файл экспорта уже существует; явно разрешите перезапись.
A Sketch target is supported only for DXF export. = Целевой эскиз можно указать только для экспорта DXF.
Model export requires an open Part or Assembly. = Для экспорта модели требуется открытый Part или сборка.
Specify the Sketch to export as DXF. = Укажите эскиз для экспорта в DXF.
The Part has no calculated body; invoke Regenerate first. = В Part нет рассчитанного тела; сначала выполните регенерацию.
STL export of nested assemblies is not supported yet. = Экспорт вложенных сборок в STL пока не поддерживается.
There are no visible calculated bodies to export. = Нет видимых рассчитанных тел для экспорта.
The exporter produced an empty file. = Экспорт создал пустой файл.
The export runner did not finish writing the file. = Задача экспорта не завершила запись файла.
Export the persisted model snapshot without regenerating or modifying the document. = Экспортирует сохранённое состояние модели без регенерации и изменения документа.
The destination extension does not match the requested export format. = Расширение целевого файла не соответствует выбранному формату экспорта.
Exportuji %1… = Экспорт %1…

; Shared Assembly import commands
The import destination parent directory does not exist. = Родительский каталог назначения импорта не существует.
Assembly import requires a new destination directory. = Для импорта сборки требуется новый каталог назначения.
An imported native file escaped its destination directory. = Импортированный собственный файл находится вне каталога назначения.
This import requires an open Assembly. = Для этого импорта требуется открытая сборка.
Assembly import supports STEP, IGES and DXF. = Импорт сборки поддерживает STEP, IGES и DXF.
Assembly file import creates a new component; it cannot append to an existing Sketch. = Импорт файла в сборку создаёт новый компонент; добавление в существующий эскиз невозможно.
The target Assembly changed while importing; its current data was preserved. = Целевая сборка изменилась во время импорта; её текущие данные сохранены.
An imported source conflicts with an open document. = Импортированный источник конфликтует с открытым документом.
The import runner did not finish writing the native documents. = Задача импорта не завершила запись собственных документов.
Import a source file into the active Part or Assembly through the shared model transaction. = Импортирует исходный файл в активную деталь или сборку общей транзакцией модели.
This import requires an ordinary Part or Assembly. = Для этого импорта требуется обычная деталь или сборка.
A destination directory is supported only when importing into an Assembly. = Каталог назначения можно указать только при импорте в сборку.
Import dokončen: %1 dílů, %2 podsestav = Импорт завершён: %1 деталей, %2 подсборок

; Shared document metadata commands
Parameter keys must be nonempty, unique and contain no surrounding whitespace or control characters. = Ключи параметров должны быть непустыми, уникальными, без пробелов по краям и управляющих символов.
A document supports at most 4096 user parameters. = Документ поддерживает не более 4096 пользовательских параметров.
Parameter labels and values must belong to an ordered parameter. = Подписи и значения должны принадлежать параметру из упорядоченного списка.
A parameter supports at most 128 language variants. = Параметр поддерживает не более 128 языковых вариантов.
A parameter value is too long or contains a null character. = Значение параметра слишком длинное или содержит нулевой символ.
Choose a supported unit for every document quantity. = Выберите поддерживаемую единицу для каждой величины документа.
All document precision values are required. = Требуются все значения точности документа.
Decimal places must be an integer from 0 to 12. = Количество десятичных знаков должно быть целым числом от 0 до 12.
Tolerances must be from 0 to 1000000; mesh deflection must be at least 0.000000001. = Допуски должны быть от 0 до 1000000; отклонение сетки должно быть не менее 0,000000001.
Document metadata requires an open Part or Assembly. = Для метаданных требуется открытая деталь или сборка.
Metadata entries must be JSON objects with supported fields. = Записи метаданных должны быть объектами JSON с поддерживаемыми полями.
Metadata values and labels must be objects of strings. = Значения и подписи метаданных должны быть объектами строк.
Every parameter needs a string key. = Каждому параметру требуется строковый ключ.
Specify document units or precision to update. = Укажите единицы или точность документа для изменения.
Precision values must be finite numbers; decimal places must be an integer. = Значения точности должны быть конечными числами; количество десятичных знаков должно быть целым.
Cannot encode document precision. = Не удалось записать точность документа.
Read ordered user parameters, shared values and language variants. = Читает упорядоченные параметры, общие значения и языковые варианты.
Replace the complete ordered parameter table without calculating geometry. = Заменяет всю упорядоченную таблицу параметров без расчёта геометрии.
Read document units, tolerances and display precision. = Читает единицы документа, допуски и точность отображения.
Update document units and precision, calculating affected local geometry when required. = Изменяет единицы и точность, при необходимости рассчитывая затронутую локальную геометрию.
A document supports at most 4096 relations. = Документ поддерживает не более 4096 зависимостей.
A family table supports at most 512 columns and 4096 instances. = Таблица семейства поддерживает не более 512 столбцов и 4096 экземпляров.
A family value refers to an unknown column. = Значение варианта ссылается на неизвестный столбец.
A material property supports at most 128 descriptions. = Свойство материала поддерживает не более 128 описаний.
A material supports at most 4096 properties. = Материал поддерживает не более 4096 свойств.
A relation expression must contain 1 to 16384 bytes without null characters. = Выражение зависимости должно содержать от 1 до 16384 байт без нулевых символов.
Every material property needs a string key, value and optional unit. = Каждое свойство материала требует текстовый ключ, значение и необязательную единицу.
Every relation needs a string target and expression. = Каждая зависимость требует текстовую цель и выражение.
Family instance names must be unique and different from the generic document name. = Имена вариантов должны быть уникальными и отличаться от имени базового документа.
Family table columns must be unique. = Столбцы таблицы семейства должны быть уникальными.
Invalid native family instance structure. = Недопустимая нативная структура варианта.
Invalid native family table structure. = Недопустимая нативная структура таблицы семейства.
Material density must be finite and positive. = Плотность материала должна быть конечной и положительной.
Material descriptions must belong to an existing property. = Описания материала должны относиться к существующему свойству.
Material property names must be unique. = Имена свойств материала должны быть уникальными.
Material units must belong to an existing property. = Единицы материала должны относиться к существующему свойству.
Metadata text is too long or contains a null character. = Текст метаданных слишком длинный или содержит нулевой символ.
Read document material properties, units and localized descriptions. = Прочитать свойства материала документа, единицы и переведённые описания.
Read ordered parameter relations and cached physical values. = Прочитать упорядоченные зависимости параметров и сохранённые физические значения.
Read the stored family table without generating instances. = Прочитать сохранённую таблицу семейства без создания экземпляров.
Relation decimal places must be between 0 and 12. = Число десятичных знаков зависимости должно быть от 0 до 12.
Relation expression nesting is too deep. = Слишком большая глубина вложенности выражения зависимости.
Relation target and expression are required = Требуются цель и выражение зависимости.
Relation targets must be unique ASCII identifiers. = Цели зависимостей должны быть уникальными идентификаторами ASCII.
Replace and evaluate parameter relations without calculating geometry. = Заменить и вычислить зависимости параметров без расчёта геометрии.
Replace material data and update cached physical relations. = Заменить данные материала и обновить зависимости по сохранённым физическим значениям.
Replace the stored family table without generating geometry. = Заменить сохранённую таблицу семейства без создания геометрии.
The material property unit is not supported. = Единица свойства материала не поддерживается.
Metadata keys contain a reserved native file separator. = Ключи метаданных содержат зарезервированный разделитель нативного файла.
Native metadata values must be single lines without surrounding spaces or tabs. = Нативные значения метаданных должны быть однострочными, без пробелов и табуляций по краям.
A native material library requires the .matz extension. = Нативная библиотека материалов требует расширение .matz.
The material library must be an existing regular file. = Библиотека материалов должна быть существующим обычным файлом.
Cannot open the material library. = Не удалось открыть библиотеку материалов.
The material library must contain 1 byte to 16 MiB. = Размер библиотеки материалов должен быть от 1 байта до 16 МиБ.
The material library changed or could not be read completely. = Библиотека материалов изменилась или не была прочитана полностью.
The material library must be valid UTF-8 text without null characters. = Библиотека материалов должна содержать корректный текст UTF-8 без нулевых символов.
Unknown section in the native material library. = Неизвестный раздел в нативной библиотеке материалов.
Duplicate section or key in the native material library. = Повторяющийся раздел или ключ в нативной библиотеке материалов.
Invalid native material library line. = Недопустимая строка нативной библиотеки материалов.
The material library requires a name and a Properties section. = Библиотека материалов требует имя и раздел Properties.
The material name must be declared only in the Material section. = Имя материала должно быть задано только в разделе Material.
Load a native material library into the document without retaining a file dependency. = Загрузить нативную библиотеку материалов в документ без сохранения зависимости от файла.
