Aktivní dokument, výskyt a potvrzený výběr. = Aktives Dokument, Vorkommen und bestätigte Auswahl.
Strom zobrazeného dokumentu bez výpočtu geometrie. = Dokumentbaum ohne Geometrieberechnung.
Otevřít nativní dokument: open cesta. = Natives Dokument öffnen: open Pfad.
Konzole otevírá soubory prtz, asmz a drwz. = Die Konsole öffnet prtz-, asmz- und drwz-Dateien.
Nový dokument: new part|assembly|drawing název. = Neues Dokument: new part|assembly|drawing Name.
Zadejte název bez cesty a přípony. = Namen ohne Pfad und Erweiterung eingeben.
Uložit aktivní dokument; volitelně ověřit jeho ID. = Aktives Dokument speichern; optional die ID prüfen.
Nejprve určete cestu dokumentu pomocí Uložit jako. = Zuerst mit Speichern unter den Dokumentpfad festlegen.
Výslovně regenerovat aktivní model. = Aktives Modell ausdrücklich regenerieren.
Tento příkaz podporuje Part a Assembly. = Dieser Befehl unterstützt Part und Assembly.
Některé prvky nebyly vypočteny. = Einige Elemente konnten nicht berechnet werden.
Znovu provést změnu. = Änderung wiederholen.
Vrátit změnu. = Änderung rückgängig machen.
Žádná změna není k dispozici. = Keine Änderung verfügbar.
Přizpůsobit model velikosti pohledu. = Modell an die Ansicht anpassen.
