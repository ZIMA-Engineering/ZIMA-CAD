Explicitly refresh a Sketch's references from its document's calculated snapshot. = Skizzenreferenzen ausdrücklich aus dem berechneten Dokumentzustand aktualisieren.
Persisted source axis geometry is unavailable = Gespeicherte Geometrie der Quellachse ist nicht verfügbar
Persisted source edge geometry is unavailable = Gespeicherte Geometrie der Quellkante ist nicht verfügbar
Persisted source point geometry is unavailable = Gespeicherte Geometrie des Quellpunkts ist nicht verfügbar
Persisted source reference is ambiguous = Die gespeicherte Quellreferenz ist mehrdeutig
