The font glyph does not contain vector geometry. = Das Schriftzeichen enthält keine Vektorgeometrie.

; Native spline properties
Read spline properties, stable control points and exact parameterization. = Liest Spline-Eigenschaften, stabile Kontrollpunkte und die exakte Parametrisierung.
Edit spline properties while preserving identity, exact geometry and constraints. = Bearbeitet Spline-Eigenschaften unter Erhalt von Identität, exakter Geometrie und Beziehungen.
B-spline editing must preserve the number of control points. = Beim Bearbeiten einer B-Spline muss die Anzahl der Kontrollpunkte erhalten bleiben.
Edit the source reference, trim or offset instead of its generated spline. = Bearbeiten Sie die Quellreferenz, den Zuschnitt oder den Versatz dieser abgeleiteten Spline.
Exact spline degree and closure must retain their parameterization. = Grad und Geschlossenheit einer exakten Spline müssen ihre Parametrisierung beibehalten.
Repeated spline points require identical coordinates. = Wiederholte Spline-Punkte müssen identische Koordinaten haben.
A fixed or source-driven spline point cannot be moved. = Ein fester oder quellgesteuerter Spline-Punkt kann nicht verschoben werden.
Spline properties conflict with the Sketch constraints. = Die Spline-Eigenschaften widersprechen den Skizzenbedingungen.

; Native Part imports
This import requires an open Part. = Dieser Import erfordert ein geöffnetes Part.
Part import supports STEP, IGES and DXF. = Der Part-Import unterstützt STEP, IGES und DXF.
The import source file does not exist. = Die Quelldatei für den Import existiert nicht.
Only DXF can be imported into a Sketch. = In eine Skizze kann nur DXF importiert werden.
The import runner did not complete the calculation. = Der Importauftrag hat die Berechnung nicht abgeschlossen.
The target Part changed while importing; its current data was preserved. = Das Ziel-Part wurde während des Imports geändert; seine aktuellen Daten wurden beibehalten.
Import cannot replace the target document identity. = Der Import darf die Identität des Zieldokuments nicht ersetzen.
Import a source file into the active Part through the shared model transaction. = Importiert eine Quelldatei mit der gemeinsamen Modelltransaktion in das aktive Part.
This import requires an ordinary Part. = Dieser Import erfordert ein reguläres Part.
The source extension does not match the requested import format. = Die Dateiendung der Quelle entspricht nicht dem angeforderten Importformat.
Import mesh deflection must be positive = Die Netzabweichung beim Import muss positiv sein.

; Native model exports
DXF export currently supports segments, circles and circular arcs; other geometry would be lost. = Der DXF-Export unterstützt derzeit Strecken, Kreise und Kreisbögen; andere Geometrie würde verloren gehen.
Cannot create the export staging directory. = Das temporäre Exportverzeichnis kann nicht erstellt werden.
Model export supports STEP, STL and DXF. = Der Modellexport unterstützt STEP, STL und DXF.
The export destination directory does not exist. = Das Exportzielverzeichnis existiert nicht.
The export destination already exists; request overwrite explicitly. = Das Exportziel existiert bereits; erlauben Sie das Überschreiben ausdrücklich.
A Sketch target is supported only for DXF export. = Eine Zielskizze kann nur beim DXF-Export angegeben werden.
Model export requires an open Part or Assembly. = Der Modellexport erfordert ein geöffnetes Part oder eine Baugruppe.
Specify the Sketch to export as DXF. = Geben Sie die als DXF zu exportierende Skizze an.
The Part has no calculated body; invoke Regenerate first. = Das Part hat keinen berechneten Körper; führen Sie zuerst Regenerieren aus.
STL export of nested assemblies is not supported yet. = Der STL-Export verschachtelter Baugruppen wird noch nicht unterstützt.
There are no visible calculated bodies to export. = Es sind keine sichtbaren berechneten Körper zum Exportieren vorhanden.
The exporter produced an empty file. = Der Export hat eine leere Datei erzeugt.
The export runner did not finish writing the file. = Der Exportauftrag hat das Schreiben der Datei nicht abgeschlossen.
Export the persisted model snapshot without regenerating or modifying the document. = Exportiert den gespeicherten Modellzustand ohne Regeneration oder Dokumentänderung.
The destination extension does not match the requested export format. = Die Zieldateiendung entspricht nicht dem angeforderten Exportformat.
Exportuji %1… = %1 wird exportiert…

; Shared Assembly import commands
The import destination parent directory does not exist. = Das übergeordnete Importzielverzeichnis existiert nicht.
Assembly import requires a new destination directory. = Der Baugruppenimport benötigt ein neues Zielverzeichnis.
An imported native file escaped its destination directory. = Eine importierte native Datei liegt außerhalb des Zielverzeichnisses.
This import requires an open Assembly. = Dieser Import benötigt eine geöffnete Baugruppe.
Assembly import supports STEP, IGES and DXF. = Der Baugruppenimport unterstützt STEP, IGES und DXF.
Assembly file import creates a new component; it cannot append to an existing Sketch. = Der Dateiimport in eine Baugruppe erstellt eine neue Komponente; er kann keine vorhandene Skizze erweitern.
The target Assembly changed while importing; its current data was preserved. = Die Zielbaugruppe wurde während des Imports geändert; ihre aktuellen Daten wurden beibehalten.
An imported source conflicts with an open document. = Eine importierte Quelle steht im Konflikt mit einem geöffneten Dokument.
The import runner did not finish writing the native documents. = Der Import hat das Schreiben der nativen Dokumente nicht abgeschlossen.
Import a source file into the active Part or Assembly through the shared model transaction. = Importiert eine Quelldatei über die gemeinsame Modelltransaktion in das aktive Teil oder die aktive Baugruppe.
This import requires an ordinary Part or Assembly. = Dieser Import benötigt ein reguläres Teil oder eine reguläre Baugruppe.
A destination directory is supported only when importing into an Assembly. = Ein Zielverzeichnis kann nur beim Import in eine Baugruppe angegeben werden.
Import dokončen: %1 dílů, %2 podsestav = Import abgeschlossen: %1 Teile, %2 Unterbaugruppen

; Shared document metadata commands
Parameter keys must be nonempty, unique and contain no surrounding whitespace or control characters. = Parameterschlüssel müssen nichtleer und eindeutig sein und dürfen keine umgebenden Leerzeichen oder Steuerzeichen enthalten.
A document supports at most 4096 user parameters. = Ein Dokument unterstützt höchstens 4096 Benutzerparameter.
Parameter labels and values must belong to an ordered parameter. = Parameterbeschriftungen und Werte müssen zu einem aufgeführten Parameter gehören.
A parameter supports at most 128 language variants. = Ein Parameter unterstützt höchstens 128 Sprachvarianten.
A parameter value is too long or contains a null character. = Ein Parameterwert ist zu lang oder enthält ein Nullzeichen.
Choose a supported unit for every document quantity. = Wählen Sie für jede Dokumentgröße eine unterstützte Einheit.
All document precision values are required. = Alle Genauigkeitswerte des Dokuments sind erforderlich.
Decimal places must be an integer from 0 to 12. = Die Anzahl der Dezimalstellen muss eine ganze Zahl von 0 bis 12 sein.
Tolerances must be from 0 to 1000000; mesh deflection must be at least 0.000000001. = Toleranzen müssen zwischen 0 und 1000000 liegen; die Netzabweichung muss mindestens 0,000000001 sein.
Document metadata requires an open Part or Assembly. = Dokumentmetadaten benötigen ein geöffnetes Teil oder eine geöffnete Baugruppe.
Metadata entries must be JSON objects with supported fields. = Metadateneinträge müssen JSON-Objekte mit unterstützten Feldern sein.
Metadata values and labels must be objects of strings. = Metadatenwerte und Beschriftungen müssen Objekte aus Zeichenfolgen sein.
Every parameter needs a string key. = Jeder Parameter benötigt einen Textschlüssel.
Specify document units or precision to update. = Geben Sie die zu ändernden Dokumenteinheiten oder Genauigkeiten an.
Precision values must be finite numbers; decimal places must be an integer. = Genauigkeitswerte müssen endliche Zahlen sein; Dezimalstellen müssen ganzzahlig sein.
Cannot encode document precision. = Die Dokumentgenauigkeit kann nicht kodiert werden.
Read ordered user parameters, shared values and language variants. = Liest geordnete Benutzerparameter, gemeinsame Werte und Sprachvarianten.
Replace the complete ordered parameter table without calculating geometry. = Ersetzt die gesamte geordnete Parametertabelle ohne Geometrieberechnung.
Read document units, tolerances and display precision. = Liest Dokumenteinheiten, Toleranzen und Anzeigegenauigkeit.
Update document units and precision, calculating affected local geometry when required. = Ändert Dokumenteinheiten und Genauigkeit und berechnet bei Bedarf die betroffene lokale Geometrie.
A document supports at most 4096 relations. = Ein Dokument unterstützt höchstens 4096 Beziehungen.
A family table supports at most 512 columns and 4096 instances. = Eine Familientabelle unterstützt höchstens 512 Spalten und 4096 Instanzen.
A family value refers to an unknown column. = Ein Familienwert verweist auf eine unbekannte Spalte.
A material property supports at most 128 descriptions. = Eine Materialeigenschaft unterstützt höchstens 128 Beschreibungen.
A material supports at most 4096 properties. = Ein Material unterstützt höchstens 4096 Eigenschaften.
A relation expression must contain 1 to 16384 bytes without null characters. = Ein Beziehungsausdruck muss 1 bis 16384 Bytes ohne Nullzeichen enthalten.
Every material property needs a string key, value and optional unit. = Jede Materialeigenschaft benötigt einen Textschlüssel, einen Textwert und optional eine Einheit.
Every relation needs a string target and expression. = Jede Beziehung benötigt ein Textziel und einen Ausdruck.
Family instance names must be unique and different from the generic document name. = Variantennamen müssen eindeutig sein und sich vom Namen des Basisdokuments unterscheiden.
Family table columns must be unique. = Die Spalten der Familientabelle müssen eindeutig sein.
Invalid native family instance structure. = Ungültige native Variantenstruktur.
Invalid native family table structure. = Ungültige native Familientabellenstruktur.
Material density must be finite and positive. = Die Materialdichte muss endlich und positiv sein.
Material descriptions must belong to an existing property. = Materialbeschreibungen müssen zu einer vorhandenen Eigenschaft gehören.
Material property names must be unique. = Namen von Materialeigenschaften müssen eindeutig sein.
Material units must belong to an existing property. = Materialeinheiten müssen zu einer vorhandenen Eigenschaft gehören.
Metadata text is too long or contains a null character. = Der Metadatentext ist zu lang oder enthält ein Nullzeichen.
Read document material properties, units and localized descriptions. = Materialeigenschaften, Einheiten und übersetzte Beschreibungen des Dokuments lesen.
Read ordered parameter relations and cached physical values. = Geordnete Parameterbeziehungen und gespeicherte physikalische Werte lesen.
Read the stored family table without generating instances. = Die gespeicherte Familientabelle ohne Erzeugung von Instanzen lesen.
Relation decimal places must be between 0 and 12. = Die Anzahl der Dezimalstellen einer Beziehung muss zwischen 0 und 12 liegen.
Relation expression nesting is too deep. = Der Beziehungsausdruck ist zu tief verschachtelt.
Relation target and expression are required = Ziel und Ausdruck der Beziehung sind erforderlich.
Relation targets must be unique ASCII identifiers. = Beziehungsziele müssen eindeutige ASCII-Kennungen sein.
Replace and evaluate parameter relations without calculating geometry. = Parameterbeziehungen ohne Geometrieberechnung ersetzen und auswerten.
Replace material data and update cached physical relations. = Materialdaten ersetzen und Beziehungen aus gespeicherten physikalischen Werten aktualisieren.
Replace the stored family table without generating geometry. = Die gespeicherte Familientabelle ohne Geometrieerzeugung ersetzen.
The material property unit is not supported. = Die Einheit der Materialeigenschaft wird nicht unterstützt.
Metadata keys contain a reserved native file separator. = Metadatenschlüssel enthalten ein reserviertes Trennzeichen des nativen Dateiformats.
Native metadata values must be single lines without surrounding spaces or tabs. = Native Metadatenwerte müssen einzeilig sein und dürfen keine führenden oder abschließenden Leerzeichen oder Tabulatoren enthalten.
A native material library requires the .matz extension. = Eine native Materialbibliothek benötigt die Dateiendung .matz.
The material library must be an existing regular file. = Die Materialbibliothek muss eine vorhandene reguläre Datei sein.
Cannot open the material library. = Die Materialbibliothek kann nicht geöffnet werden.
The material library must contain 1 byte to 16 MiB. = Die Materialbibliothek muss zwischen 1 Byte und 16 MiB groß sein.
The material library changed or could not be read completely. = Die Materialbibliothek wurde geändert oder konnte nicht vollständig gelesen werden.
The material library must be valid UTF-8 text without null characters. = Die Materialbibliothek muss gültigen UTF-8-Text ohne Nullzeichen enthalten.
Unknown section in the native material library. = Unbekannter Abschnitt in der nativen Materialbibliothek.
Duplicate section or key in the native material library. = Doppelter Abschnitt oder Schlüssel in der nativen Materialbibliothek.
Invalid native material library line. = Ungültige Zeile in der nativen Materialbibliothek.
The material library requires a name and a Properties section. = Die Materialbibliothek benötigt einen Namen und einen Abschnitt Properties.
The material name must be declared only in the Material section. = Der Materialname darf nur im Abschnitt Material angegeben werden.
Load a native material library into the document without retaining a file dependency. = Eine native Materialbibliothek ohne dauerhafte Dateiverknüpfung in das Dokument laden.
Component insertion would create a dependency cycle. = Das Einfügen der Komponente würde einen Abhängigkeitszyklus erzeugen.
The component dependency graph is too large or too deep. = Der Abhängigkeitsgraph der Komponente ist zu groß oder zu tief.
Open the referenced source documents before inserting this component. = Öffnen Sie vor dem Einfügen dieser Komponente die referenzierten Quelldokumente.
The component source file belongs to a different document. = Die Quelldatei der Komponente gehört zu einem anderen Dokument.
Component insertion requires an open owning Assembly. = Das Einfügen einer Komponente erfordert eine geöffnete übergeordnete Baugruppe.
Open the owning Assembly in its own tab before inserting a component. = Öffnen Sie die übergeordnete Baugruppe vor dem Einfügen einer Komponente in ihrem eigenen Tab.
The component source must be an open Part or Assembly. = Die Komponentenquelle muss ein geöffnetes Teil oder eine geöffnete Baugruppe sein.
A component name must contain 1 to 256 bytes. = Ein Komponentenname muss 1 bis 256 Bytes enthalten.
Unknown component source kind. = Unbekannter Typ der Komponentenquelle.
Component commands require an open Assembly. = Komponentenbefehle erfordern eine geöffnete Baugruppe.
List component occurrences from the stored Assembly hierarchy. = Komponentenvorkommen aus der gespeicherten Baugruppenhierarchie auflisten.
Component query limit must be from 1 to 10000. = Das Limit der Komponentenabfrage muss zwischen 1 und 10000 liegen.
Read one exact persisted occurrence and its available component data. = Ein genaues gespeichertes Vorkommen und seine verfügbaren Komponentendaten lesen.
The requested component occurrence does not exist. = Das angeforderte Komponentenvorkommen existiert nicht.
Insert an open Part or Assembly through the shared native insertion transaction. = Ein geöffnetes Teil oder eine Baugruppe über die gemeinsame native Einfügetransaktion einfügen.
The selected component has no available native source file. = Für die ausgewählte Komponente ist keine native Quelldatei verfügbar.
The owning Assembly changed while its component source was being opened. = Während die Komponentenquelle geöffnet wurde, hat sich die übergeordnete Baugruppe oder das aktive Dokument geändert.
Native source reading did not complete. = Das Lesen der nativen Quelle wurde nicht abgeschlossen.
Open the native source of an exact component occurrence without regenerating it. = Die native Quelle eines genauen Komponentenvorkommens ohne Regenerierung öffnen.

Drawing commands require an open Drawing. = Zeichnungsbefehle benötigen eine geöffnete Zeichnung.
The drawing sheet does not exist. = Das Zeichnungsblatt existiert nicht.
Drawing names and language codes must be non-empty bounded single-line text. = Blattname und Sprachcode müssen nichtleerer einzeiliger Text zulässiger Länge sein.
Invalid drawing sheet format or projection method. = Ungültiges Blattformat oder Projektionsverfahren.
Drawing sheet scale must be from 0.001 to 1000. = Der Blattmaßstab muss zwischen 0,001 und 1000 liegen.
Drawing line widths must be from 0.05 to 2 mm. = Linienbreiten müssen zwischen 0,05 und 2 mm liegen.
The last drawing sheet cannot be removed. = Das letzte Zeichnungsblatt kann nicht entfernt werden.
Another drawing sheet contains a dependent view. = Ein anderes Blatt enthält eine abhängige Ansicht.
A stored source model is required to update section hatching. = Zum Aktualisieren der Schnittschraffur ist ein berechnetes Quellmodell erforderlich.
Use a native frmz frame or tblz title-block template. = Verwenden Sie eine native frmz-Rahmen- oder tblz-Schriftfeldvorlage.
The drawing source file belongs to a different document. = Die Quelldatei gehört zu einem anderen Dokument.
Drawing sources must be Parts or Assemblies. = Zeichnungsquellen müssen Teile oder Baugruppen sein.
The Part has no saved calculated model. Regenerate and save it first. = Das Teil hat kein gespeichertes berechnetes Modell. Regenerieren und speichern Sie es zuerst.
Drawing sources must be native prtz or asmz files. = Zeichnungsquellen müssen native prtz- oder asmz-Dateien sein.
Read the stored properties of one drawing sheet. = Gespeicherte Eigenschaften eines Zeichnungsblatts lesen.
List stored drawing sheets without projection or source loading. = Gespeicherte Blätter ohne Projektion oder Laden von Quellen auflisten.
Create a drawing sheet with explicit paper settings. = Ein Zeichnungsblatt mit festgelegten Papiereinstellungen erstellen.
Edit drawing sheet settings through the shared sheet operation. = Blatteinstellungen über die gemeinsame Modelloperation bearbeiten.
Delete one drawing sheet and its contained views and dimensions. = Ein Blatt samt Ansichten und Bemaßungen löschen.
Remove the embedded drawing template geometry. = Die eingebettete Vorlagengeometrie entfernen.
Load and embed a native drawing template. = Eine native Zeichnungsvorlage laden und einbetten.

List original measuring references stored with a drawing view. = Gespeicherte ursprüngliche Messreferenzen einer Ansicht auflisten.
Read stored drawing views without loading source models. = Gespeicherte Ansichten ohne Laden der Quellmodelle lesen.
Drawing query limit must be from 1 to 10000. = Das Abfragelimit muss zwischen 1 und 10000 liegen.
Drawing reference kind must be all, curve or point. = Der Referenztyp muss all, curve oder point sein.
Delete a drawing view, its projected descendants and their dimensions. = Eine Ansicht mit ihren abgeleiteten Projektionsansichten und Bemaßungen löschen.
The source Section no longer exists. Edit the drawing view first. = Der Quellschnitt existiert nicht mehr. Bearbeiten Sie zuerst die Ansicht.
A source section trace no longer exists. Edit the drawing view first. = Eine Quellschnittspur existiert nicht mehr. Bearbeiten Sie zuerst die Ansicht.
The drawing projection hierarchy is too deep. = Die Hierarchie der Projektionsansichten ist zu tief.
Drawing views contain a cyclic dependency. = Die Ansichten enthalten eine zyklische Abhängigkeit.
The parent drawing view is unavailable. = Die übergeordnete Ansicht ist nicht verfügbar.
A projected view must use its parent source document. = Eine Projektionsansicht muss das Quelldokument ihrer übergeordneten Ansicht verwenden.
The drawing view does not exist. = Die Zeichnungsansicht existiert nicht.

The source has no calculated geometry. Regenerate it first. = Die Quelle hat keine berechnete Geometrie. Regenerieren Sie sie zuerst.
Invalid drawing view parameters. = Ungültige Parameter der Zeichnungsansicht.
Create a drawing view from a calculated source or a parent view. = Erstellt eine Zeichnungsansicht aus einer berechneten Quelle oder übergeordneten Ansicht.
Edit a drawing view and update its projected descendants. = Bearbeitet eine Zeichnungsansicht und aktualisiert ihre abgeleiteten Ansichten.
A source document or parent view is required. = Ein Quelldokument oder eine übergeordnete Ansicht ist erforderlich.
A projected view inherits its source and camera; use distance_mm for its position. = Eine projizierte Ansicht übernimmt Quelle und Kamera; verwenden Sie distance_mm für ihre Position.
The drawing source must be an open Part or Assembly. = Die Zeichnungsquelle muss ein geöffnetes Teil oder eine geöffnete Baugruppe sein.

Úhlová = Winkel
Vyberte dvě přímé hrany pro úhlovou kótu. = Wählen Sie zwei gerade Kanten für das Winkelmaß.
Chybí přímá hrana úhlové kóty. Vyberte její náhradu. = Eine gerade Kante des Winkelmaßes fehlt. Wählen Sie einen Ersatz.
Vyberte dvě různé přímé hrany. = Wählen Sie zwei verschiedene gerade Kanten.

Invalid Show/Erase arguments. = Ungültige Argumente für Anzeigen/Ausblenden.
An annotation may be specified only once per view. = Eine Anmerkung darf pro Ansicht nur einmal angegeben werden.
The drawing annotation reference is ambiguous. = Die Referenz der Zeichnungsanmerkung ist mehrdeutig.
The drawing annotation does not exist. = Die Zeichnungsanmerkung existiert nicht.
An unresolved drawing annotation cannot change visibility. = Die Sichtbarkeit einer Anmerkung mit ungültiger Referenz kann nicht geändert werden.
Each Show/Erase batch may include a view only once. = Jeder Anzeigen/Ausblenden-Stapel darf eine Ansicht nur einmal enthalten.
Invalid Show/Erase mode or selection. = Ungültiger Modus oder ungültige Auswahl für Anzeigen/Ausblenden.
Invalid drawing annotation kind. = Ungültiger Typ der Zeichnungsanmerkung.
The selected annotation is not offered by Show/Erase. = Die ausgewählte Anmerkung wird von Anzeigen/Ausblenden nicht angeboten.
List stored model annotations and Show/Erase candidates without source loading. = Gespeicherte Modellanmerkungen und Anzeigen/Ausblenden-Kandidaten ohne Laden der Quelle auflisten.
Apply shared Show/Erase selections to one or more drawing views. = Die gemeinsame Anzeigen/Ausblenden-Auswahl auf eine oder mehrere Zeichnungsansichten anwenden.

List measured drawing dimensions and their resolved or last valid values. = Gemessene Zeichnungsmaße und ihre aktuellen oder letzten gültigen Werte auflisten.
Read measured dimension references, style, layout and reference validity. = Referenzen, Stil, Anordnung und Referenzgültigkeit eines gemessenen Maßes lesen.
Delete a measured drawing dimension with shared GUI history behavior. = Ein gemessenes Zeichnungsmaß mit gemeinsamer GUI-Historie löschen.
The measured drawing dimension does not exist. = Das gemessene Zeichnungsmaß existiert nicht.
