Create a native Sketch relation using explicitly ordered points and geometry. = Eine Skizzenbedingung mit ausdrücklich geordneten Punkten und Geometrien erstellen.
The constraint requires a different number of points or geometry references. = Die Bedingung benötigt eine andere Anzahl von Punkten oder Geometriereferenzen.
Tangency requires two curves and at most one contact point. = Tangentialität benötigt zwei Kurven und höchstens einen Berührungspunkt.
Unknown Sketch constraint kind. = Unbekannter Skizzenbedingungstyp.
Remove a Sketch relation and solve its remaining constraints. = Eine Skizzenbedingung entfernen und die übrigen Bedingungen lösen.
Explicitly solve a Sketch without calculating a solid body. = Eine Skizze ausdrücklich ohne Volumenkörperberechnung lösen.
