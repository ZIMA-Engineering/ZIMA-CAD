Body operations require an open Part. = Körperoperationen erfordern ein geöffnetes Teil.

Body history changed while properties were open. = Der Körperverlauf wurde bei geöffneten Eigenschaften geändert.

The requested Body does not exist. = Der angeforderte Körper existiert nicht.

The requested Body Boolean does not exist. = Die angeforderte boolesche Körperoperation existiert nicht.

Body properties cannot replace identity, contents or dependencies. = Körpereigenschaften dürfen Identität, Inhalt oder Abhängigkeiten nicht ersetzen.

Boolean properties cannot replace its identity. = Boolesche Eigenschaften dürfen die Identität nicht ersetzen.

