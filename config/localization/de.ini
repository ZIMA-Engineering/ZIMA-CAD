Specify a nonempty object name. = Geben Sie einen nicht leeren Objektnamen ein.

Expected add, subtract or intersect. = Erwartet wird add, subtract oder intersect.

Read Bodies, Boolean results and their history order. = Körper, boolesche Ergebnisse und ihre Reihenfolge im Verlauf lesen.

Read Body properties and persisted placement references. = Körpereigenschaften und gespeicherte Platzierungsreferenzen lesen.

