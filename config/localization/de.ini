A symmetric line dimension requires an axis and one or two lines. = Ein symmetrisches Linienmaß erfordert eine Achse und eine oder zwei Linien.
A symmetric point dimension requires one or two points and an axis. = Ein symmetrisches Punktmaß erfordert einen oder zwei Punkte und eine Achse.
