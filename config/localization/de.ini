Translation requires at least one native point or geometry ID. = Eine Verschiebung benötigt mindestens eine Punkt- oder Geometrie-ID.

; Sketch offset and curve operations
The native Sketch offset does not exist. = Der Skizzenversatz existiert nicht.
Retain requires 1 to 1024 nonoverlapping intervals. = Das Beibehalten benötigt 1 bis 1024 nicht überlappende Intervalle.
Each retained interval must be [start, end] inside [0, 1]. = Jedes beibehaltene Intervall muss [start, end] innerhalb [0, 1] sein.
Retained intervals must not overlap. = Beibehaltene Intervalle dürfen sich nicht überlappen.
Offset a native Sketch curve; distance is positive millimetres. = Eine Skizzenkurve um einen positiven Abstand in Millimetern versetzen.
Edit all retained pieces of one Sketch offset operation. = Alle beibehaltenen Teile eines Skizzenversatzes bearbeiten.
Read an offset's source, retained interval and repair state. = Quelle, beibehaltenes Intervall und Reparaturstatus eines Versatzes lesen.
Detach an offset while preserving its current curve and identity. = Einen Versatz lösen und seine Kurve und Identität beibehalten.
Read a curve's complete supporting spline and visible interval. = Den vollständigen Basisspline und das sichtbare Intervall einer Kurve lesen.
Retain explicit curve intervals while preserving the original supporting geometry. = Angegebene Kurvenintervalle und die ursprüngliche Basisgeometrie beibehalten.
List current intersection-bounded curve pieces for explicit trimming. = Aktuelle Kurvenstücke zwischen Schnittpunkten zum Trimmen auflisten.
Remove explicitly identified current trim pieces; stale intervals are rejected. = Exakt bestimmte aktuelle Kurvenstücke entfernen; veraltete Intervalle werden abgelehnt.
Trim requires 1 to 2048 piece identities. = Trimmen benötigt 1 bis 2048 Teilidentitäten.
Each trim identity requires exactly geometry, start and end. = Jede Trimmidentität benötigt genau geometry, start und end.
A trim piece cannot be selected twice. = Ein Kurvenstück kann nicht zweimal zum Trimmen gewählt werden.
The requested trim piece no longer exists; read the current pieces. = Das angeforderte Kurvenstück existiert nicht mehr; aktuelle Teile neu lesen.
Mirror native Sketch entities about an explicitly identified Sketch axis. = Skizzenelemente an einer ausdrücklich bestimmten Skizzenachse spiegeln.
Mirror requires native Sketch entities. = Spiegeln benötigt native Skizzenelemente.
Create an oriented rectangle using a Sketch symmetry axis. = Ein ausgerichtetes Rechteck mit einer Skizzensymmetrieachse erstellen.
Create a circular arc tangent to an explicitly identified curve. = Einen Kreisbogen tangential zu einer bestimmten Kurve erstellen.
Create a common tangent segment using two curves and contact hints. = Eine gemeinsame Tangente zweier Kurven mit Berührungshinweisen erstellen.
Round a Sketch corner without destroying its source segments. = Eine Skizzenecke abrunden und die Quellstrecken erhalten.

