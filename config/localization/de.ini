The history index must be a nonnegative integer. = Der Verlaufsindex muss eine nicht negative ganze Zahl sein.

Read a Body Boolean and its two source results. = Boolesche Körperoperation und ihre beiden Quellergebnisse lesen.

Calculate a Boolean from two available Body results. = Boolesche Operation aus zwei verfügbaren Körperergebnissen berechnen.

Edit a Body Boolean using the same operation as Properties. = Boolesche Körperoperation wie in den Eigenschaften bearbeiten.

Specify at least one Boolean property. = Geben Sie mindestens eine boolesche Eigenschaft an.

; Shared Part history commands
History operations require an open Part. = Historienoperationen benötigen ein geöffnetes Teil.
History changed; some dependent features could not be calculated. = Historie geändert; einige abhängige Elemente konnten nicht berechnet werden.
Read Part history, ownership, suppression and calculation errors. = Teilhistorie, Zugehörigkeit, Unterdrückung und Berechnungsfehler lesen.
Set suppression of a history object and calculate the Part. = Unterdrückung eines Historienobjekts setzen und das Teil berechnen.
Delete a history object, Body or Boolean and calculate the Part. = Historienobjekt, Körper oder Boolean löschen und das Teil berechnen.
Move an object before another in the same history; omit before for the end. = Objekt vor ein anderes in derselben Historie verschieben; ohne before ans Ende.
Check history order and dependencies without calculating geometry. = Historienreihenfolge und Abhängigkeiten ohne Geometrieberechnung prüfen.
Set the insertion index in the flattened Part history. = Einfügeindex in der gesamten Teilhistorie setzen.
Activate the owning Body before editing its history. = Vor dem Bearbeiten der Historie den zugehörigen Körper aktivieren.
The requested history object does not exist or is owned by a feature. = Das Historienobjekt existiert nicht oder gehört zu einem Element.
The object and destination must belong to the same history scope. = Objekt und Ziel müssen zum selben Historienbereich gehören.
The move would break a history dependency. = Das Verschieben würde eine Historienabhängigkeit verletzen.
The history index is outside the document history. = Der Index liegt außerhalb der Dokumenthistorie.
The first feature of a Body cannot be subtractive. = Das erste Element eines Körpers darf nicht subtraktiv sein.
The move would remove a persisted reference. = Das Verschieben würde eine gespeicherte Referenz entfernen.
The move would remove original reference geometry. = Das Verschieben würde ursprüngliche Referenzgeometrie entfernen.
The move would break a construction reference. = Das Verschieben würde eine Konstruktionsreferenz beschädigen.
The move would break a container reference. = Das Verschieben würde eine Containerreferenz beschädigen.
The move would break an external Sketch reference. = Das Verschieben würde eine externe Skizzenreferenz beschädigen.

; Original reference queries
Reference queries require an open Part or Assembly. = Referenzabfragen benötigen ein geöffnetes Teil oder eine Baugruppe.
Reference pagination is outside the supported range. = Die Referenzseitengröße liegt außerhalb des erlaubten Bereichs.
Reference kind must be face, edge, point or axis. = Der Referenztyp muss face, edge, point oder axis sein.
The persisted reference geometry is incomplete. = Die gespeicherte Referenzgeometrie ist unvollständig.
List persisted original faces, edges, points and axes without calculation. = Gespeicherte ursprüngliche Flächen, Kanten, Punkte und Achsen ohne Berechnung auflisten.
Read one original reference and its bounded persisted geometry in document coordinates. = Eine ursprüngliche Referenz und ihre begrenzten Geometriedaten in Dokumentkoordinaten lesen.
The exact original reference was not found in the stored document state. = Die genaue ursprüngliche Referenz wurde im gespeicherten Dokumentzustand nicht gefunden.

; Shared Sketch geometry commands
A B-spline requires 2 to 4096 points. = Ein B-Spline benötigt 2 bis 4096 Punkte.
A Sketch name must contain 1 to 1024 UTF-8 bytes. = Der Skizzenname muss 1 bis 1024 UTF-8-Bytes enthalten.
A new Part Sketch must have its own Sketch container. = Eine neue Bauteilskizze benötigt einen eigenen Skizzencontainer.
A point must be [x, y] in Sketch millimetres. = Ein Punkt muss als [x, y] in Skizzenmillimetern angegeben werden.
A standalone Assembly Sketch cannot own a cut container. = Eine eigenständige Baugruppenskizze kann keinen Schnittcontainer besitzen.
Add a constrained native rectangle from opposite corners. = Ein Rechteck mit Bedingungen aus gegenüberliegenden Ecken hinzufügen.
Add a native B-spline from control or interpolation points. = Einen B-Spline aus Kontroll- oder Interpolationspunkten hinzufügen.
Add a native point in Sketch coordinates (mm). = Einen Punkt in Skizzenkoordinaten (mm) hinzufügen.
Add a native segment between two Sketch points (mm). = Eine Strecke zwischen zwei Skizzenpunkten (mm) hinzufügen.
Add a regular polygon using a center and rim point. = Ein regelmäßiges Vieleck aus Mittelpunkt und Randpunkt hinzufügen.
Add an exact circle with radius in millimetres. = Einen exakten Kreis mit Radius in Millimetern hinzufügen.
Add an exact circular arc through start and end points. = Einen exakten Kreisbogen mit Start- und Endpunkt hinzufügen.
Add exact elliptical geometry from its center and axis endpoints. = Exakte Ellipsengeometrie aus Mittelpunkt und Achsenendpunkten hinzufügen.
An ID list must contain at most 4096 strings. = Eine ID-Liste darf höchstens 4096 Zeichenfolgen enthalten.
An ID list must contain nonempty strings. = Eine ID-Liste muss nicht leere Zeichenfolgen enthalten.
Coordinates must be finite numbers in millimetres. = Koordinaten müssen endliche Zahlen in Millimetern sein.
Create a standalone Sketch using the standard container factory. = Eine eigenständige Skizze mit dem Standardcontainer erstellen.
Delete native Sketch geometry using the Sketcher's dependency rules. = Skizzengeometrie nach den Abhängigkeitsregeln des Skizzierers löschen.
Each B-spline point must be [x, y]. = Jeder B-Spline-Punkt muss [x, y] sein.
Edit this Sketch through its owning section operation. = Diese Skizze über die zugehörige Schnittoperation bearbeiten.
Integer argument is outside its allowed range. = Das ganzzahlige Argument liegt außerhalb des erlaubten Bereichs.
List persisted Sketches without calculating geometry. = Gespeicherte Skizzen ohne Geometrieberechnung auflisten.
List stable Sketch entity IDs and kinds. = Stabile IDs und Typen der Skizzenelemente auflisten.
Move a native point subject to its constraints. = Einen Punkt unter Beachtung seiner Bedingungen verschieben.
Read Sketch metadata and geometry counts. = Skizzenmetadaten und Anzahlen der Geometrieelemente lesen.
Read one persisted Sketch entity; lengths use millimetres. = Ein gespeichertes Skizzenelement lesen; Längen in Millimetern.
Remove a native point and its dependent Sketch geometry. = Einen Punkt samt abhängiger Skizzengeometrie entfernen.
Set a native point's fixed state. = Den Fixierungszustand eines Punkts setzen.
Set a native segment's unbounded centerline state. = Eine Strecke als unbegrenzte Mittellinie setzen oder zurücksetzen.
Set the auxiliary state of native Sketch geometry. = Den Hilfsgeometriestatus eines Skizzenelements setzen.
Sketch commands require an ordinary Part or Assembly. = Skizzenbefehle benötigen ein normales Bauteil oder eine Baugruppe.
Sketch creation requires the active document. = Die Skizzenerstellung benötigt das aktive Dokument.
Sketch operations require an open Part or Assembly. = Skizzenoperationen benötigen ein geöffnetes Bauteil oder eine Baugruppe.
Sketch plane must be XY, XZ or YZ. = Die Skizzenebene muss XY, XZ oder YZ sein.
Snap tolerance must be positive millimetres. = Die Fangtoleranz muss positiv sein, in Millimetern.
The Sketch entity does not exist. = Das Skizzenelement existiert nicht.
The Sketch identity already exists. = Die Skizzenidentität existiert bereits.
The entity exceeds the 64 KiB query limit. = Das Element überschreitet das Abfragelimit von 64 KiB.
The native Sketch geometry does not exist. = Die Skizzengeometrie existiert nicht.
The native Sketch point does not exist. = Der Skizzenpunkt existiert nicht.
The point cannot move to the requested position. = Der Punkt kann nicht an die gewünschte Position verschoben werden.
The requested Sketch does not exist. = Die angeforderte Skizze existiert nicht.
The selection cannot translate by the requested displacement. = Die Auswahl kann nicht um den angeforderten Versatz verschoben werden.
