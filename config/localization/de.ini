Dimension angle sector must be -1, 0 or 1. = Der Winkelsektor des Maßes muss -1, 0 oder 1 sein.
Dimension label layout must belong to the edited Sketch. = Die Maßbeschriftung muss zur bearbeiteten Skizze gehören.
Dimension layout flags must be booleans. = Schalter für die Maßanordnung müssen boolesche Werte sein.
Dimension limits accept only lower and upper. = Maßgrenzen akzeptieren nur lower und upper.
Dimension solution side must be -1 or 1. = Die Lösungsseite des Maßes muss -1 oder 1 sein.
Dimension text accepts known string fields of at most 2048 bytes. = Maßtext akzeptiert bekannte Zeichenfolgenfelder mit höchstens 2048 Bytes.
Read a Sketch dimension's parameters, references and label layout. = Parameter, Referenzen und Beschriftungsanordnung eines Skizzenmaßes lesen.
Remove a Sketch dimension using the native solver transaction. = Ein Skizzenmaß mit der nativen Solver-Transaktion entfernen.
The Sketch dimension does not exist. = Das Skizzenmaß existiert nicht.
The dimension requires a different number of points or geometry references. = Das Maß erfordert eine andere Anzahl von Punkten oder Geometriereferenzen.
The selected axis does not match the requested coordinate dimension. = Die gewählte Achse passt nicht zum angeforderten Koordinatenmaß.
Unknown Sketch dimension kind. = Unbekannte Skizzenmaßart.
Unknown dimension label layout field. = Unbekanntes Feld der Maßbeschriftungsanordnung.
Unknown dimension tolerance mode. = Unbekannter Maßtoleranzmodus.
Angular dimension plane is defined by its measured rays = Die Ebene des Winkelmaßes wird durch seine gemessenen Schenkel bestimmt

