; Shared Part history commands
History operations require an open Part. = Operace historie vyžadují otevřený díl.
History changed; some dependent features could not be calculated. = Historie změněna; některé navazující prvky se nepodařilo vypočítat.
Read Part history, ownership, suppression and calculation errors. = Přečíst historii dílu, vlastnictví, potlačení a chyby výpočtu.
Set suppression of a history object and calculate the Part. = Nastavit potlačení objektu historie a vypočítat díl.
Delete a history object, Body or Boolean and calculate the Part. = Odstranit objekt historie, těleso nebo Boolean a vypočítat díl.
Move an object before another in the same history; omit before for the end. = Přesunout objekt před jiný ve stejné historii; bez before na konec.
Check history order and dependencies without calculating geometry. = Ověřit pořadí a závislosti historie bez výpočtu geometrie.
Set the insertion index in the flattened Part history. = Nastavit index vložení v celkovém pořadí historie dílu.
Activate the owning Body before editing its history. = Před úpravou historie aktivujte její těleso.
The requested history object does not exist or is owned by a feature. = Požadovaný objekt historie neexistuje nebo je vlastněn prvkem.
The object and destination must belong to the same history scope. = Objekt a cílové místo musí patřit do stejné historie.
The move would break a history dependency. = Přesun by porušil závislost v historii.
The history index is outside the document history. = Index leží mimo historii dokumentu.
The first feature of a Body cannot be subtractive. = První prvek tělesa nemůže být odečet.
The move would remove a persisted reference. = Přesun by odstranil uloženou referenci.
The move would remove original reference geometry. = Přesun by odstranil původní geometrii používanou pro reference.
The move would break a construction reference. = Přesun by poškodil referenci konstrukčního prvku.
The move would break a container reference. = Přesun by poškodil referenci kontejneru.
The move would break an external Sketch reference. = Přesun by poškodil externí referenci skici.

; Original reference queries
Reference queries require an open Part or Assembly. = Dotazy na reference vyžadují otevřený díl nebo sestavu.
Reference pagination is outside the supported range. = Stránkování referencí je mimo povolený rozsah.
Reference kind must be face, edge, point or axis. = Druh reference musí být face, edge, point nebo axis.
The persisted reference geometry is incomplete. = Uložená referenční geometrie je neúplná.
List persisted original faces, edges, points and axes without calculation. = Vypsat uložené původní plochy, hrany, body a osy bez výpočtu.
Read one original reference and its bounded persisted geometry in document coordinates. = Přečíst původní referenci a omezený výpis její uložené geometrie v souřadnicích dokumentu.
The exact original reference was not found in the stored document state. = Přesná původní reference nebyla v uloženém stavu dokumentu nalezena.

; Shared Sketch geometry commands
A B-spline requires 2 to 4096 points. = B-spline vyžaduje 2 až 4096 bodů.
A Sketch name must contain 1 to 1024 UTF-8 bytes. = Název skici musí mít 1 až 1024 bajtů UTF-8.
A new Part Sketch must have its own Sketch container. = Nová skica dílu musí mít vlastní kontejner skici.
A point must be [x, y] in Sketch millimetres. = Bod musí být [x, y] v milimetrech skici.
A standalone Assembly Sketch cannot own a cut container. = Samostatná skica sestavy nemůže vlastnit kontejner řezu.
Add a constrained native rectangle from opposite corners. = Přidat obdélník s vazbami podle protilehlých rohů.
Add a native B-spline from control or interpolation points. = Přidat B-spline podle řídicích nebo interpolačních bodů.
Add a native point in Sketch coordinates (mm). = Přidat bod v souřadnicích skici (mm).
Add a native segment between two Sketch points (mm). = Přidat úsečku mezi dvěma body skici (mm).
Add a regular polygon using a center and rim point. = Přidat pravidelný mnohoúhelník podle středu a bodu na obvodu.
Add an exact circle with radius in millimetres. = Přidat přesnou kružnici s poloměrem v milimetrech.
Add an exact circular arc through start and end points. = Přidat přesný kruhový oblouk podle počátečního a koncového bodu.
Add exact elliptical geometry from its center and axis endpoints. = Přidat přesnou eliptickou geometrii podle středu a konců os.
An ID list must contain at most 4096 strings. = Seznam ID může mít nejvýše 4096 řetězců.
An ID list must contain nonempty strings. = Seznam ID musí obsahovat neprázdné řetězce.
Coordinates must be finite numbers in millimetres. = Souřadnice musí být konečná čísla v milimetrech.
Create a standalone Sketch using the standard container factory. = Vytvořit samostatnou skicu běžným postupem tvorby kontejneru.
Delete native Sketch geometry using the Sketcher's dependency rules. = Odstranit geometrii skici podle pravidel jejích závislostí.
Each B-spline point must be [x, y]. = Každý bod B-spline musí být [x, y].
Edit this Sketch through its owning section operation. = Tuto skicu upravte prostřednictvím jejího řezu.
Integer argument is outside its allowed range. = Celočíselný argument je mimo povolený rozsah.
List persisted Sketches without calculating geometry. = Vypsat uložené skici bez výpočtu geometrie.
List stable Sketch entity IDs and kinds. = Vypsat stabilní ID a druhy prvků skici.
Move a native point subject to its constraints. = Přesunout bod podle jeho vazeb.
Read Sketch metadata and geometry counts. = Přečíst údaje skici a počty geometrických prvků.
Read one persisted Sketch entity; lengths use millimetres. = Přečíst uložený prvek skici; délky jsou v milimetrech.
Remove a native point and its dependent Sketch geometry. = Odstranit bod i závislou geometrii skici.
Set a native point's fixed state. = Nastavit pevnou polohu bodu.
Set a native segment's unbounded centerline state. = Nastavit úsečku jako nekonečnou osu nebo zpět.
Set the auxiliary state of native Sketch geometry. = Nastavit pomocnou geometrii skici.
Sketch commands require an ordinary Part or Assembly. = Příkazy skicáře vyžadují běžný díl nebo sestavu.
Sketch creation requires the active document. = Tvorba skici vyžaduje aktivní dokument.
Sketch operations require an open Part or Assembly. = Operace skicáře vyžadují otevřený díl nebo sestavu.
Sketch plane must be XY, XZ or YZ. = Rovina skici musí být XY, XZ nebo YZ.
Snap tolerance must be positive millimetres. = Tolerance přichycení musí být kladná, v milimetrech.
The Sketch entity does not exist. = Prvek skici neexistuje.
The Sketch identity already exists. = Identita skici již existuje.
The entity exceeds the 64 KiB query limit. = Prvek překračuje limit dotazu 64 KiB.
The native Sketch geometry does not exist. = Geometrie skici neexistuje.
The native Sketch point does not exist. = Bod skici neexistuje.
The point cannot move to the requested position. = Bod nelze přesunout do požadované polohy.
The requested Sketch does not exist. = Požadovaná skica neexistuje.
The selection cannot translate by the requested displacement. = Výběr nelze posunout o požadovanou vzdálenost.
Translate native Sketch points and geometry subject to constraints. = Posunout body a geometrii skici podle vazeb.
Translation requires at least one native point or geometry ID. = Posun vyžaduje alespoň jedno ID bodu nebo geometrie skici.

; Sketch offset and curve operations
The native Sketch offset does not exist. = Offset skici neexistuje.
Retain requires 1 to 1024 nonoverlapping intervals. = Zachování křivky vyžaduje 1 až 1024 nepřekrývajících se intervalů.
Each retained interval must be [start, end] inside [0, 1]. = Zachovaný interval musí být [start, end] v rozsahu [0, 1].
Retained intervals must not overlap. = Zachované intervaly se nesmějí překrývat.
Offset a native Sketch curve; distance is positive millimetres. = Odsadit křivku skici o kladnou vzdálenost v milimetrech.
Edit all retained pieces of one Sketch offset operation. = Upravit všechny zachované části jednoho offsetu skici.
Read an offset's source, retained interval and repair state. = Přečíst zdroj offsetu, zachovaný interval a stav reference.
Detach an offset while preserving its current curve and identity. = Uvolnit offset se zachováním křivky a její identity.
Read a curve's complete supporting spline and visible interval. = Přečíst úplnou podkladovou spline a viditelný interval křivky.
Retain explicit curve intervals while preserving the original supporting geometry. = Zachovat zadané intervaly křivky i její původní podkladovou geometrii.
List current intersection-bounded curve pieces for explicit trimming. = Vypsat aktuální části křivek mezi průsečíky pro ořezání.
Remove explicitly identified current trim pieces; stale intervals are rejected. = Odstranit přesně určené části křivek; zastaralé intervaly se odmítnou.
Trim requires 1 to 2048 piece identities. = Ořezání vyžaduje 1 až 2048 identit částí křivek.
Each trim identity requires exactly geometry, start and end. = Identita ořezávané části vyžaduje právě geometry, start a end.
A trim piece cannot be selected twice. = Část křivky nelze vybrat k ořezání dvakrát.
The requested trim piece no longer exists; read the current pieces. = Požadovaná část křivky již neexistuje; načtěte aktuální části.
Mirror native Sketch entities about an explicitly identified Sketch axis. = Zrcadlit prvky skici podle přesně určené osy.
Mirror requires native Sketch entities. = Zrcadlení vyžaduje nativní prvky skici.
Create an oriented rectangle using a Sketch symmetry axis. = Vytvořit orientovaný obdélník podle osy symetrie skici.
Create a circular arc tangent to an explicitly identified curve. = Vytvořit kruhový oblouk tečný k určené křivce.
Create a common tangent segment using two curves and contact hints. = Vytvořit společnou tečnu dvou křivek s určením míst dotyku.
Round a Sketch corner without destroying its source segments. = Zaoblit roh skici se zachováním původních úseček.

; Sketch constraints and solver
Create a native Sketch relation using explicitly ordered points and geometry. = Vytvořit vazbu skici podle výslovně určeného pořadí bodů a geometrie.
The constraint requires a different number of points or geometry references. = Vazba vyžaduje jiný počet bodů nebo geometrických referencí.
Tangency requires two curves and at most one contact point. = Tečnost vyžaduje dvě křivky a nejvýše jeden bod dotyku.
Unknown Sketch constraint kind. = Neznámý druh vazby skici.
Remove a Sketch relation and solve its remaining constraints. = Odstranit vazbu skici a vyřešit zbývající vazby.
Explicitly solve a Sketch without calculating a solid body. = Výslovně vyřešit skicu bez výpočtu tělesa.
The Sketch constraints could not be solved; no change was committed. = Vazby skici se nepodařilo vyřešit; změna nebyla provedena.
Inspect constraint residual and free degrees of freedom on a temporary Sketch copy. = Zjistit chybu vazeb a zbývající stupně volnosti na dočasné kopii skici.

; Sketch dimension commands
A symmetric line dimension requires an axis and one or two lines. = Symetrická kóta přímek vyžaduje osu a jednu nebo dvě přímky.
A symmetric point dimension requires one or two points and an axis. = Symetrická bodová kóta vyžaduje jeden nebo dva body a osu.
Create or edit Sketch dimension properties; lengths use mm and angles degrees. = Vytvoří nebo upraví vlastnosti kóty skici; délky jsou v mm a úhly ve stupních.
Dimension angle sector must be -1, 0 or 1. = Úhlový sektor kóty musí být -1, 0 nebo 1.
Dimension label layout must belong to the edited Sketch. = Umístění popisku kóty musí patřit upravované skice.
Dimension layout flags must be booleans. = Přepínače umístění kóty musí mít logickou hodnotu.
Dimension limits accept only lower and upper. = Meze kóty přijímají pouze lower a upper.
Dimension solution side must be -1 or 1. = Strana řešení kóty musí být -1 nebo 1.
Dimension text accepts known string fields of at most 2048 bytes. = Text kóty přijímá známá řetězcová pole do 2048 bajtů.
Read a Sketch dimension's parameters, references and label layout. = Načte parametry, reference a umístění popisku kóty skici.
Remove a Sketch dimension using the native solver transaction. = Odstraní kótu skici společnou transakcí řešiče.
The Sketch dimension does not exist. = Kóta skici neexistuje.
The dimension requires a different number of points or geometry references. = Kóta vyžaduje jiný počet bodů nebo geometrických referencí.
The selected axis does not match the requested coordinate dimension. = Vybraná osa neodpovídá požadované souřadnicové kótě.
Unknown Sketch dimension kind. = Neznámý druh kóty skici.
Unknown dimension label layout field. = Neznámé pole umístění popisku kóty.
Unknown dimension tolerance mode. = Neznámý režim tolerance kóty.
Angular dimension plane is defined by its measured rays = Rovina úhlové kóty je určena jejími měřenými rameny

; Sketch external reference commands
Create native profile geometry linked to an existing projected edge. = Vytvoří nativní profilovou křivku navázanou na promítnutou hranu.
Detach an external reference while preserving its native profile curves. = Odpojí externí referenci a zachová její nativní profilové křivky.
Edit an in-context reference in its owning Assembly context. = Referenci v kontextu upravte v kontextu její vlastnící sestavy.
Explicitly refresh a Sketch's references from its document's calculated snapshot. = Výslovně aktualizuje reference skici z vypočteného stavu dokumentu.
Persisted source axis geometry is unavailable = Uložená geometrie zdrojové osy není dostupná
Persisted source edge geometry is unavailable = Uložená geometrie zdrojové hrany není dostupná
Persisted source point geometry is unavailable = Uložená geometrie zdrojového bodu není dostupná
Persisted source reference is ambiguous = Uložená zdrojová reference není jednoznačná
Profile geometry requires an original edge reference. = Profilová geometrie vyžaduje referenci na původní hranu.
Project an original reference into a Sketch using its exact persisted identity. = Promítne původní referenci do skici podle přesné uložené identity.
Refresh in-context Sketch dependencies with explicit document Regenerate. = Závislosti skici v kontextu aktualizujte výslovným Regenerate dokumentu.
Source axis cannot be projected into the Sketch plane = Zdrojovou osu nelze promítnout do roviny skici
Source face has no unique intersection with the Sketch plane = Zdrojová plocha nemá jednoznačný průsečík s rovinou skici
The Sketch external reference does not exist. = Externí reference skici neexistuje.
The reference must identify an earlier Part object or an exact Assembly occurrence. = Reference musí označovat předchozí objekt Partu nebo přesný výskyt v sestavě.

; Native Sketch text commands
Cannot decompose a font glyph outline. = Nelze rozložit obrys znaku písma.
Cannot initialize the font outline engine. = Nelze inicializovat modul obrysů písma.
Cannot measure a font glyph outline. = Nelze změřit obrys znaku písma.
Cannot measure the bundled font cap height. = Nelze změřit výšku verzálek přibaleného písma.
Cannot read a font glyph outline. = Nelze načíst obrys znaku písma.
Cannot read the bundled OSIFONT. = Nelze načíst přibalený OSIFONT.
Cannot shape Sketch text. = Nelze sestavit znaky textu skici.
Create or edit Sketch text with native outlines of the bundled font. = Vytvoří nebo upraví text skici s nativními obrysy přibaleného písma.
Read text properties, contour counts and bounds without rebuilding its glyphs. = Načte vlastnosti, počty obrysů a meze textu bez nového výpočtu znaků.
Sketch text contains unsupported control characters. = Text skici obsahuje nepodporované řídicí znaky.
Sketch text curve exceeds the subdivision budget. = Křivka textu skici překračuje mez dělení.
Sketch text dimensions must be finite and height must be positive. = Rozměry textu skici musí být konečné a výška kladná.
Sketch text must be valid UTF-8. = Text skici musí být platné UTF-8.
Sketch text outline exceeds the point budget. = Obrys textu skici překračuje mez počtu bodů.
Sketch text supports at most 4096 Unicode characters. = Text skici podporuje nejvýše 4096 znaků Unicode.
Sketch text uses the bundled osifont font. = Text skici používá přibalené písmo osifont.
Text color must be green, white, yellow or red. = Barva textu musí být green, white, yellow nebo red.
Text horizontal alignment must be left, center or right. = Vodorovné zarovnání textu musí být left, center nebo right.
Text nevytváří žádný platný obrys. = Text nevytváří žádný platný obrys.
Text vertical alignment must be bottom, middle or top. = Svislé zarovnání textu musí být bottom, middle nebo top.
The Sketch text does not exist. = Text skici neexistuje.
The bundled font does not contain a requested character. = Přibalené písmo neobsahuje požadovaný znak.
The font glyph does not contain vector geometry. = Znak písma neobsahuje vektorovou geometrii.

; Native spline properties
Read spline properties, stable control points and exact parameterization. = Načte vlastnosti spline, stabilní řídicí body a přesnou parametrizaci.
Edit spline properties while preserving identity, exact geometry and constraints. = Upraví vlastnosti spline se zachováním identity, přesné geometrie a vazeb.
B-spline editing must preserve the number of control points. = Editace B-spline musí zachovat počet řídicích bodů.
Edit the source reference, trim or offset instead of its generated spline. = Upravte zdrojovou referenci, ořez nebo offset této odvozené spline.
Exact spline degree and closure must retain their parameterization. = Stupeň a uzavření přesné spline musí zachovat její parametrizaci.
Repeated spline points require identical coordinates. = Opakované body spline musí mít shodné souřadnice.
A fixed or source-driven spline point cannot be moved. = Pevný bod spline ani bod řízený zdrojem nelze přesunout.
Spline properties conflict with the Sketch constraints. = Vlastnosti spline jsou v rozporu s vazbami skici.

; Native Part imports
This import requires an open Part. = Tento import vyžaduje otevřený Part.
Part import supports STEP, IGES and DXF. = Import Partu podporuje STEP, IGES a DXF.
The import source file does not exist. = Zdrojový soubor importu neexistuje.
Only DXF can be imported into a Sketch. = Do skici lze importovat pouze DXF.
The import runner did not complete the calculation. = Úloha importu nedokončila výpočet.
The target Part changed while importing; its current data was preserved. = Cílový Part se během importu změnil; jeho aktuální data byla zachována.
Import cannot replace the target document identity. = Import nesmí nahradit identitu cílového dokumentu.
Import a source file into the active Part through the shared model transaction. = Importuje soubor do aktivního Partu společnou modelovou transakcí.
This import requires an ordinary Part. = Tento import vyžaduje běžný Part.
The source extension does not match the requested import format. = Přípona zdroje neodpovídá požadovanému formátu importu.
Import mesh deflection must be positive = Odchylka sítě importu musí být kladná.

; Native model exports
DXF export currently supports segments, circles and circular arcs; other geometry would be lost. = Export DXF nyní podporuje úsečky, kružnice a kruhové oblouky; ostatní geometrie by se ztratila.
Cannot create the export staging directory. = Nelze vytvořit dočasný adresář exportu.
Model export supports STEP, STL and DXF. = Export modelu podporuje STEP, STL a DXF.
The export destination directory does not exist. = Cílový adresář exportu neexistuje.
The export destination already exists; request overwrite explicitly. = Cílový soubor exportu již existuje; přepis povolte výslovně.
A Sketch target is supported only for DXF export. = Cílovou skicu lze zadat pouze pro export DXF.
Model export requires an open Part or Assembly. = Export modelu vyžaduje otevřený Part nebo sestavu.
Specify the Sketch to export as DXF. = Zadejte skicu pro export do DXF.
The Part has no calculated body; invoke Regenerate first. = Part nemá vypočtené těleso; nejprve spusťte Regenerovat.
STL export of nested assemblies is not supported yet. = Export vnořených sestav do STL zatím není podporován.
There are no visible calculated bodies to export. = Pro export nejsou k dispozici viditelná vypočtená tělesa.
The exporter produced an empty file. = Export vytvořil prázdný soubor.
The export runner did not finish writing the file. = Úloha exportu nedokončila zápis souboru.
Export the persisted model snapshot without regenerating or modifying the document. = Exportuje uložený stav modelu bez regenerace nebo změny dokumentu.
The destination extension does not match the requested export format. = Přípona cíle neodpovídá požadovanému formátu exportu.
Exportuji %1… = Exportuji %1…

; Shared Assembly import commands
The import destination parent directory does not exist. = Nadřazený adresář cíle importu neexistuje.
Assembly import requires a new destination directory. = Import sestavy vyžaduje nový cílový adresář.
An imported native file escaped its destination directory. = Importovaný nativní soubor je mimo cílový adresář.
This import requires an open Assembly. = Tento import vyžaduje otevřenou sestavu.
Assembly import supports STEP, IGES and DXF. = Import sestavy podporuje STEP, IGES a DXF.
Assembly file import creates a new component; it cannot append to an existing Sketch. = Import souboru do sestavy vytváří novou komponentu; nelze jej přidat do existující skici.
The target Assembly changed while importing; its current data was preserved. = Cílová sestava se během importu změnila; její aktuální data byla zachována.
An imported source conflicts with an open document. = Importovaný zdroj je v konfliktu s otevřeným dokumentem.
The import runner did not finish writing the native documents. = Úloha importu nedokončila zápis nativních dokumentů.
Import a source file into the active Part or Assembly through the shared model transaction. = Importuje zdrojový soubor do aktivního Partu nebo sestavy společnou modelovou transakcí.
This import requires an ordinary Part or Assembly. = Tento import vyžaduje běžný Part nebo sestavu.
A destination directory is supported only when importing into an Assembly. = Cílový adresář lze zadat pouze při importu do sestavy.
Import dokončen: %1 dílů, %2 podsestav = Import dokončen: %1 dílů, %2 podsestav

; Shared document metadata commands
Parameter keys must be nonempty, unique and contain no surrounding whitespace or control characters. = Klíče parametrů musí být neprázdné, jedinečné, bez okolních mezer a řídicích znaků.
A document supports at most 4096 user parameters. = Dokument podporuje nejvýše 4096 uživatelských parametrů.
Parameter labels and values must belong to an ordered parameter. = Popisky a hodnoty musí patřit parametru uvedenému v pořadí.
A parameter supports at most 128 language variants. = Parametr podporuje nejvýše 128 jazykových variant.
A parameter value is too long or contains a null character. = Hodnota parametru je příliš dlouhá nebo obsahuje nulový znak.
Choose a supported unit for every document quantity. = Pro každou veličinu dokumentu zvolte podporovanou jednotku.
All document precision values are required. = Jsou vyžadovány všechny hodnoty přesnosti dokumentu.
Decimal places must be an integer from 0 to 12. = Počet desetinných míst musí být celé číslo od 0 do 12.
Tolerances must be from 0 to 1000000; mesh deflection must be at least 0.000000001. = Tolerance musí být od 0 do 1000000; odchylka triangulace alespoň 0,000000001.
Document metadata requires an open Part or Assembly. = Metadata dokumentu vyžadují otevřený Part nebo sestavu.
Metadata entries must be JSON objects with supported fields. = Položky metadat musí být JSON objekty s podporovanými poli.
Metadata values and labels must be objects of strings. = Hodnoty a popisky metadat musí být objekty textových řetězců.
Every parameter needs a string key. = Každý parametr vyžaduje textový klíč.
Specify document units or precision to update. = Zadejte jednotky nebo přesnost dokumentu ke změně.
Precision values must be finite numbers; decimal places must be an integer. = Hodnoty přesnosti musí být konečná čísla; počet desetinných míst musí být celé číslo.
Cannot encode document precision. = Přesnost dokumentu nelze zapsat.
Read ordered user parameters, shared values and language variants. = Přečte uspořádané uživatelské parametry, sdílené hodnoty a jazykové varianty.
Replace the complete ordered parameter table without calculating geometry. = Nahradí celou uspořádanou tabulku parametrů bez výpočtu geometrie.
Read document units, tolerances and display precision. = Přečte jednotky dokumentu, tolerance a přesnost zobrazení.
Update document units and precision, calculating affected local geometry when required. = Změní jednotky a přesnost dokumentu a v případě potřeby vypočte dotčenou místní geometrii.
A document supports at most 4096 relations. = Dokument podporuje nejvýše 4096 relací.
A family table supports at most 512 columns and 4096 instances. = Tabulka variant podporuje nejvýše 512 sloupců a 4096 instancí.
A family value refers to an unknown column. = Hodnota varianty odkazuje na neznámý sloupec.
A material property supports at most 128 descriptions. = Vlastnost materiálu podporuje nejvýše 128 popisů.
A material supports at most 4096 properties. = Materiál podporuje nejvýše 4096 vlastností.
A relation expression must contain 1 to 16384 bytes without null characters. = Výraz relace musí mít 1 až 16384 bajtů a nesmí obsahovat nulové znaky.
Every material property needs a string key, value and optional unit. = Každá vlastnost materiálu vyžaduje textový klíč, hodnotu a případně jednotku.
Every relation needs a string target and expression. = Každá relace vyžaduje textový cíl a výraz.
Family instance names must be unique and different from the generic document name. = Názvy variant musí být jedinečné a odlišné od názvu základního dokumentu.
Family table columns must be unique. = Sloupce tabulky variant musí být jedinečné.
Invalid native family instance structure. = Neplatná nativní struktura varianty.
Invalid native family table structure. = Neplatná nativní struktura tabulky variant.
Material density must be finite and positive. = Hustota materiálu musí být konečná a kladná.
Material descriptions must belong to an existing property. = Popisy materiálu musí patřit existující vlastnosti.
Material property names must be unique. = Názvy vlastností materiálu musí být jedinečné.
Material units must belong to an existing property. = Jednotky materiálu musí patřit existující vlastnosti.
Metadata text is too long or contains a null character. = Text metadat je příliš dlouhý nebo obsahuje nulový znak.
Read document material properties, units and localized descriptions. = Přečte vlastnosti materiálu dokumentu, jednotky a jazykové popisy.
Read ordered parameter relations and cached physical values. = Přečte uspořádané relace parametrů a uložené fyzikální hodnoty.
Read the stored family table without generating instances. = Přečte uloženou tabulku variant bez vytváření instancí.
Relation decimal places must be between 0 and 12. = Počet desetinných míst relace musí být od 0 do 12.
Relation expression nesting is too deep. = Výraz relace je příliš hluboko vnořený.
Relation target and expression are required = Relace vyžaduje cíl a výraz.
Relation targets must be unique ASCII identifiers. = Cíle relací musí být jedinečné identifikátory ASCII.
Replace and evaluate parameter relations without calculating geometry. = Nahradí a vyhodnotí relace parametrů bez výpočtu geometrie.
Replace material data and update cached physical relations. = Nahradí data materiálu a aktualizuje relace z uložených fyzikálních hodnot.
Replace the stored family table without generating geometry. = Nahradí uloženou tabulku variant bez vytváření geometrie.
The material property unit is not supported. = Jednotka vlastnosti materiálu není podporovaná.
Metadata keys contain a reserved native file separator. = Klíče metadat obsahují vyhrazený oddělovač nativního souboru.
Native metadata values must be single lines without surrounding spaces or tabs. = Nativní hodnoty metadat musí být na jednom řádku bez okolních mezer a tabulátorů.
A native material library requires the .matz extension. = Nativní materiálová knihovna vyžaduje příponu .matz.
The material library must be an existing regular file. = Materiálová knihovna musí být existující běžný soubor.
Cannot open the material library. = Materiálovou knihovnu nelze otevřít.
The material library must contain 1 byte to 16 MiB. = Materiálová knihovna musí mít velikost od 1 bajtu do 16 MiB.
The material library changed or could not be read completely. = Materiálová knihovna se změnila nebo ji nelze přečíst celou.
The material library must be valid UTF-8 text without null characters. = Materiálová knihovna musí být platný text UTF-8 bez nulových znaků.
Unknown section in the native material library. = Neznámá sekce v nativní materiálové knihovně.
Duplicate section or key in the native material library. = Duplicitní sekce nebo klíč v nativní materiálové knihovně.
Invalid native material library line. = Neplatný řádek nativní materiálové knihovny.
The material library requires a name and a Properties section. = Materiálová knihovna vyžaduje název a sekci Properties.
The material name must be declared only in the Material section. = Název materiálu musí být uveden pouze v sekci Material.
Load a native material library into the document without retaining a file dependency. = Načte nativní materiálovou knihovnu do dokumentu bez zachování závislosti na souboru.
Component insertion would create a dependency cycle. = Vložení komponenty by vytvořilo cyklus závislostí.
The component dependency graph is too large or too deep. = Graf závislostí komponenty je příliš rozsáhlý nebo hluboký.
Open the referenced source documents before inserting this component. = Před vložením této komponenty otevřete odkazované zdrojové dokumenty.
The component source file belongs to a different document. = Zdrojový soubor komponenty patří jinému dokumentu.
Component insertion requires an open owning Assembly. = Vložení komponenty vyžaduje otevřenou vlastnící sestavu.
Open the owning Assembly in its own tab before inserting a component. = Před vložením komponenty otevřete vlastnící sestavu na její samostatné kartě.
The component source must be an open Part or Assembly. = Zdrojem komponenty musí být otevřený díl nebo sestava.
A component name must contain 1 to 256 bytes. = Název komponenty musí mít 1 až 256 bajtů.
Unknown component source kind. = Neznámý druh zdroje komponenty.
Component commands require an open Assembly. = Příkazy komponent vyžadují otevřenou sestavu.
List component occurrences from the stored Assembly hierarchy. = Vypíše výskyty komponent z uložené hierarchie sestavy.
Component query limit must be from 1 to 10000. = Limit dotazu na komponenty musí být od 1 do 10000.
Read one exact persisted occurrence and its available component data. = Přečte jeden přesný uložený výskyt a dostupná data jeho komponenty.
The requested component occurrence does not exist. = Požadovaný výskyt komponenty neexistuje.
Insert an open Part or Assembly through the shared native insertion transaction. = Vloží otevřený díl nebo sestavu společnou nativní transakcí.
The selected component has no available native source file. = Vybraná komponenta nemá dostupný nativní zdrojový soubor.
The owning Assembly changed while its component source was being opened. = Během otevírání zdroje komponenty se změnila vlastnící sestava nebo aktivní dokument.
Native source reading did not complete. = Čtení nativního zdroje nebylo dokončeno.
Open the native source of an exact component occurrence without regenerating it. = Otevře nativní zdroj přesného výskytu komponenty bez regenerace.

Drawing commands require an open Drawing. = Příkazy výkresu vyžadují otevřený výkres.
The drawing sheet does not exist. = List výkresu neexistuje.
Drawing names and language codes must be non-empty bounded single-line text. = Název listu a kód jazyka musí být neprázdný jednořádkový text povolené délky.
Invalid drawing sheet format or projection method. = Neplatný formát listu nebo způsob promítání.
Drawing sheet scale must be from 0.001 to 1000. = Měřítko listu musí být od 0,001 do 1000.
Drawing line widths must be from 0.05 to 2 mm. = Tloušťky čar musí být od 0,05 do 2 mm.
The last drawing sheet cannot be removed. = Poslední list výkresu nelze odstranit.
Another drawing sheet contains a dependent view. = Jiný list obsahuje závislý pohled.
A stored source model is required to update section hatching. = Pro aktualizaci šrafování je potřeba dostupný vypočtený zdrojový model.
Use a native frmz frame or tblz title-block template. = Použijte nativní formát frmz nebo razítko tblz.
The drawing source file belongs to a different document. = Zdrojový soubor výkresu patří jinému dokumentu.
Drawing sources must be Parts or Assemblies. = Zdrojem výkresu musí být díl nebo sestava.
The Part has no saved calculated model. Regenerate and save it first. = Díl nemá uložený vypočtený model. Nejprve jej regenerujte a uložte.
Drawing sources must be native prtz or asmz files. = Zdroje výkresu musí být nativní soubory prtz nebo asmz.
Read the stored properties of one drawing sheet. = Přečte uložené vlastnosti jednoho listu výkresu.
List stored drawing sheets without projection or source loading. = Vypíše uložené listy bez projekce nebo načítání zdrojů.
Create a drawing sheet with explicit paper settings. = Vytvoří list výkresu se zadanými parametry papíru.
Edit drawing sheet settings through the shared sheet operation. = Upraví nastavení listu společnou modelovou operací.
Delete one drawing sheet and its contained views and dimensions. = Odstraní list včetně jeho pohledů a kót.
Remove the embedded drawing template geometry. = Odstraní vloženou geometrii výkresové šablony.
Load and embed a native drawing template. = Načte a vloží nativní výkresovou šablonu.

List original measuring references stored with a drawing view. = Vypíše původní měřicí reference uložené s pohledem.
Read stored drawing views without loading source models. = Přečte uložené pohledy bez načítání zdrojových modelů.
Drawing query limit must be from 1 to 10000. = Limit dotazu na výkres musí být od 1 do 10000.
Drawing reference kind must be all, curve or point. = Druh reference výkresu musí být all, curve nebo point.
Delete a drawing view, its projected descendants and their dimensions. = Odstraní pohled, jeho odvozené projekční pohledy a jejich kóty.
The source Section no longer exists. Edit the drawing view first. = Zdrojový řez již neexistuje. Nejprve upravte vlastnosti pohledu.
A source section trace no longer exists. Edit the drawing view first. = Zdrojová trasa řezu již neexistuje. Nejprve upravte vlastnosti pohledu.
The drawing projection hierarchy is too deep. = Hierarchie projekčních pohledů je příliš hluboká.
Drawing views contain a cyclic dependency. = Pohledy obsahují cyklickou závislost.
