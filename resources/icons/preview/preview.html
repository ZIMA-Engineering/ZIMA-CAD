<style>
body{font-family:Arial,sans-serif;margin:28px;color:#1e1e1e}
h1{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{border:1px solid #ddd;border-radius:10px;padding:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{height:72px;display:grid;place-items:center;border-radius:7px}
.tile img{width:42px;height:42px}
.light{background:#fff;color:#1e1e1e;border:1px solid #eee}
.dark{background:#1e1e1e;color:#f2f2f2}
.label{font-size:13px;margin-top:9px;text-align:center}
</style>
