<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">ZIMA-CAD — barevné rozlišení Part a Assembly</title>
  <desc id="description">Part je prázdná obrysová krychle. Assembly používá tři žluté plochy stejné kostky.</desc>
  <defs>
    <style>
      .ui { font-family: "Noto Sans", "DejaVu Sans", sans-serif; }
      .title { font-size: 40px; font-weight: 720; fill: #f4f6f7; }
      .subtitle { font-size: 18px; fill: #aeb8c0; }
      .heading { font-size: 25px; font-weight: 700; fill: #f4f6f7; }
      .section { font-size: 15px; font-weight: 720; fill: #80aa1a; letter-spacing: 1.2px; }
      .body { font-size: 16px; fill: #b7c0c7; }
      .tree-dark { font-size: 16px; fill: #eef1f3; }
      .tree-light { font-size: 16px; fill: #20262b; }
      .tab { font-size: 16px; font-weight: 650; fill: #ffffff; }
    </style>
    <symbol id="part" viewBox="0 0 24 24">
      <g fill="none" stroke="inherit" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.3 7.3 12 3l7.7 4.3-7.7 4.4-7.7-4.4z"/>
        <path d="M4.3 7.3v9.1L12 21l7.7-4.6V7.3"/>
        <path d="M12 11.7V21"/>
      </g>
    </symbol>
    <symbol id="assembly" viewBox="0 0 24 24">
      <path d="M4.3 7.3 12 3l7.7 4.3-7.7 4.4z" fill="#ffd45a"/>
      <path d="M4.3 7.3v9.1L12 21v-9.3z" fill="#d59a1f"/>
      <path d="M19.7 7.3v9.1L12 21v-9.3z" fill="#f0b82d"/>
      <g fill="none" stroke="inherit" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.3 7.3 12 3l7.7 4.3-7.7 4.4-7.7-4.4z"/>
        <path d="M4.3 7.3v9.1L12 21l7.7-4.6V7.3"/>
        <path d="M12 11.7V21"/>
      </g>
    </symbol>
  </defs>

  <rect width="1200" height="760" fill="#111518"/>
  <rect width="12" height="760" fill="#80aa1a"/>
  <g class="ui">
    <text x="62" y="68" class="title">Jedna kostka, jiná informace</text>
    <text x="62" y="104" class="subtitle">Part = prázdný obrys. Assembly = tři plné žluté plochy.</text>

    <rect x="60" y="142" width="520" height="328" rx="18" fill="#1a2024" stroke="#384249"/>
    <text x="88" y="187" class="section">PART — PRÁZDNÝ OBRYS</text>
    <text x="88" y="225" class="heading">Prázdná obrysová krychle</text>
    <g stroke="#f2f2f2"><use href="#part" transform="translate(235 270) scale(6.2)"/></g>

    <rect x="620" y="142" width="520" height="328" rx="18" fill="#1a2024" stroke="#80aa1a" stroke-width="2"/>
    <text x="648" y="187" class="section">ASSEMBLY — BAREVNÁ HMOTA</text>
    <text x="648" y="225" class="heading">Tři odstíny žluté</text>
    <g stroke="#f2f2f2"><use href="#assembly" transform="translate(795 270) scale(6.2)"/></g>

    <text x="60" y="519" class="section">SKUTEČNÁ VELIKOST 18 PX</text>

    <rect x="60" y="540" width="335" height="112" rx="10" fill="#111619" stroke="#2c353b"/>
    <g stroke="#f2f2f2">
      <use href="#part" transform="translate(82 558) scale(.75)"/>
      <use href="#assembly" transform="translate(82 611) scale(.75)"/>
    </g>
    <text x="116" y="573" class="tree-dark">Příruba.prtz</text>
    <text x="116" y="626" class="tree-dark">Pohon.asmz</text>

    <rect x="430" y="540" width="335" height="112" rx="10" fill="#edf0f2"/>
    <g stroke="#1e2428">
      <use href="#part" transform="translate(452 558) scale(.75)"/>
      <use href="#assembly" transform="translate(452 611) scale(.75)"/>
    </g>
    <text x="486" y="573" class="tree-light">Příruba.prtz</text>
    <text x="486" y="626" class="tree-light">Pohon.asmz</text>

    <rect x="800" y="540" width="340" height="112" rx="10" fill="#2b8f16"/>
    <g stroke="#ffffff">
      <use href="#part" transform="translate(822 558) scale(.75)"/>
      <use href="#assembly" transform="translate(822 611) scale(.75)"/>
    </g>
    <text x="856" y="573" class="tab">Příruba.prtz</text>
    <text x="856" y="626" class="tab">Pohon.asmz</text>

    <circle cx="68" cy="703" r="7" fill="#80aa1a"/>
    <text x="88" y="710" class="body">Rozdíl je založený současně na výplni i barvě: Part = prázdný obrys, Assembly = plná žlutá hmota.</text>
  </g>
</svg>
